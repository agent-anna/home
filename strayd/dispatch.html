<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Veg Anna Radio - Dispatch Console</title><style>
:root{--bg:#0b0f17;--card:#131a26;--card2:#192232;--tx:#eef3fb;--mu:#9fb0c8;--ac:#38bdf8;--ok:#4ade80;--bd:rgba(255,255,255,.14)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px}
.wrap{max-width:1200px;margin:0 auto}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.nav a{color:var(--tx);text-decoration:none;background:var(--card2);padding:6px 11px;border-radius:8px;font-size:.86rem}
.nav a.on,.nav a:hover{background:var(--ac);color:#061018;font-weight:600}
.top{display:grid;grid-template-columns:300px 1fr;gap:20px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;align-items:start}
@media(max-width:820px){.top{grid-template-columns:1fr}.art-box{max-width:320px;margin:0 auto}}
.art-box img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--bd)}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}
label{display:block;font-size:.78rem;color:var(--mu);margin-bottom:4px}
select,input,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-family:inherit}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.dj-ta{min-height:115px;line-height:1.6;padding:12px}
.press-ta{min-height:460px;line-height:1.65;padding:14px}
.soc-ta{min-height:185px;line-height:1.55;padding:12px}
.soc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sleft{display:flex;align-items:center;gap:10px;font-weight:600}
.sleft img{width:42px;height:42px;border-radius:8px;object-fit:cover}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,a.btn{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;font-size:.8rem;cursor:pointer;text-decoration:none;display:inline-block}
button.pri{background:var(--ac);color:#061018;border:none;font-weight:600;padding:8px 14px}
button.ok{background:var(--ok);color:#05140b;border:none;font-weight:600;padding:8px 14px}
#st{color:var(--ac);font-size:.85rem}</style></head>

<script>
const $=id=>document.getElementById(id);
const setVal=(id,v)=>{const el=$(id);if(el)el.value=String(v||"");};
const setTxt=(id,v)=>{const el=$(id);if(el)el.textContent=String(v||"");};
const CH=[
  ["x","X",280,"https://x.com/intent/tweet?text="],
  ["tiktok","TikTok",2200,"https://www.tiktok.com/upload"],
  ["instagram","Instagram",2200,"https://www.instagram.com/"],
  ["facebook","Facebook",63206,"https://www.facebook.com/sharer/sharer.php?u=https%3A%2F%2Fstrayd.com&quote="],
  ["ytTitle","YouTube Title",100,"https://studio.youtube.com/"],
  ["ytDesc","YouTube Description",5000,"https://studio.youtube.com/"]
];
const COUNTRIES="Philippines, Australia, Ecuador, United States, Chile, Canada, Indonesia, France, Thailand, and United Kingdom";
const APPLE_URL="https://music.apple.com/us/album/adhd-i-can-do-that-travillen-disorder/1863323315?i=1863323317";
const BUNDLE_URL="https://tinyurl.com/martinstrayd";
const HUB_URL="https://strayd.com";
const YT_URL="https://www.youtube.com/@martinstrayd";
let SONGS=[],VOICES=[],BIBLE_RULES="",META={date:"",track:"",artist:"",topic:""};

const scrub=s=>String(s||"")
  .replace(/<think>[\s\S]*?<\/think>/gi,"")
  .replace(/^```(?:json)?\s*|\s*```$/gim,"")
  .replace(/\u2014/g,", ")
  .replace(/\u2013/g,"-")
  .replace(/[:\-=*#~]{4,}/g," ")
  .replace(/\s+,/g,",")
  .replace(/[ \t]{2,}/g," ")
  .trim();

function buildCards(){
  const grid=$("socGrid");
  if(!grid)return;
  grid.innerHTML="";
  CH.forEach(([id,lbl,lim,postBase])=>{
    const art=document.createElement("article");
    art.className="scard";
    art.setAttribute("aria-label",lbl);
    const head=document.createElement("div");
    head.className="shead";
    const left=document.createElement("div");
    left.className="sleft";
    const img=document.createElement("img");
    img.setAttribute("data-th","");
    img.alt=lbl+" cover art";
    const h2=document.createElement("h2");
    h2.style.margin="0";h2.style.fontSize="1rem";h2.textContent=lbl;
    left.appendChild(img);left.appendChild(h2);
    const cnt=document.createElement("span");
    cnt.id="c_"+id;cnt.style.color="var(--mu)";cnt.style.fontSize=".8rem";cnt.textContent="0 / "+lim;
    head.appendChild(left);head.appendChild(cnt);
    const lab=document.createElement("label");
    lab.htmlFor="t_"+id;lab.textContent=lbl+" Post";
    const ta=document.createElement("textarea");
    ta.id="t_"+id;ta.className="soc-ta";ta.maxLength=lim;
    ta.addEventListener("input",()=>{cnt.textContent=ta.value.length+" / "+lim;});
    const bar=document.createElement("div");
    bar.className="bar";
    const bSpk=document.createElement("button");
    bSpk.type="button";bSpk.textContent="Speak";bSpk.onclick=()=>speakTxt(ta.value,false);
    const bDl=document.createElement("button");
    bDl.type="button";bDl.textContent="Download Audio";bDl.onclick=()=>dlAudio(ta.value,id+"-anna");
    const bCpy=document.createElement("button");
    bCpy.type="button";bCpy.textContent="Copy";bCpy.onclick=()=>cpyTxt(ta.value,lbl);
    const bPost=document.createElement("button");
    bPost.type="button";bPost.className="pri";bPost.textContent="Post to "+lbl;
    bPost.onclick=()=>{
      cpyTxt(ta.value,lbl);
      const u=(id==="x"||id==="facebook")?(postBase+encodeURIComponent(ta.value)):postBase;
      window.open(u,"_blank","noopener");
    };
    bar.appendChild(bSpk);bar.appendChild(bDl);bar.appendChild(bCpy);bar.appendChild(bPost);
    art.appendChild(head);art.appendChild(lab);art.appendChild(ta);art.appendChild(bar);
    grid.appendChild(art);
  });
}

function getPat(){
  const p=(($("patIn")&&$("patIn").value)||"").trim()||localStorage.getItem("anna_dispatch_pat")||"";
  if(p)localStorage.setItem("anna_dispatch_pat",p);
  return p;
}

function b64ToUtf8(b64){
  const bin=atob(String(b64||"").replace(/\s+/g,""));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function utf8ToB64(str){
  const bytes=new TextEncoder().encode(String(str||""));
  let bin="";
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}

async function fetchRepo(p){
  const pat=getPat();
  if(pat){
    try{
      const r=await fetch("https://api.github.com/repos/agent-anna/home/contents/"+p+"?ref=main",{
        headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github.v3+json"},cache:"no-store"
      });
      if(r.ok){const j=await r.json();if(j&&j.content)return b64ToUtf8(j.content);}
    }catch{}
  }
  for(const b of["https://agent-anna.github.io/home/","https://raw.githubusercontent.com/agent-anna/home/main/"]){
    try{const r=await fetch(b+p+"?t="+Date.now(),{cache:"no-store"});if(r.ok)return await r.text();}catch{}
  }
  return"";
}

async function putRepo(p,content,msg){
  const pat=getPat();
  if(!pat)throw new Error("Enter GitHub PAT first");
  const api="https://api.github.com/repos/agent-anna/home/contents/"+p;
  const g=await fetch(api+"?ref=main",{headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github.v3+json"},cache:"no-store"});
  if(!g.ok)throw new Error("GET HTTP "+g.status);
  const gj=await g.json();
  const put=await fetch(api,{
    method:"PUT",
    headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},
    body:JSON.stringify({message:msg,content:utf8ToB64(content),sha:gj.sha,branch:"main"})
  });
  if(!put.ok)throw new Error("PUT HTTP "+put.status);
  return await put.json();
}

function artUrl(s,t){
  const r=String((s&&(s.artUrl||s.art||s.image||s.artwork))||"").trim();
  if(!r)return"https://martinstrayd.github.io/artist/store-art/Martin%20Strayd%20-%20"+encodeURIComponent(t)+".png";
  if(/^https?:\/\//i.test(r))return r;
  return"https://martinstrayd.github.io/artist/"+encodeURI(r.replace(/^\.?\//,""));
}

function syncSong(){
  const idx=$("songSel")?Number($("songSel").value||0):0;
  const s=SONGS[idx]||{title:"Adhd I Can Do That (Travillen Disorder)",artist:"Martin Strayd"};
  const t=scrub(s.title||s.name||"Adhd I Can Do That (Travillen Disorder)");
  const a=scrub(s.artist||"Martin Strayd");
  const topic=scrub(($("angleIn")&&$("angleIn").value)||s.topic||s.theme||s.genre||"unstoppable creative overdrive and modern life");
  const u=artUrl(s,t);
  setTxt("songTitle",t);
  setTxt("songMeta",a+" - "+SONGS.length+" songs - Veg Anna Radio Dispatch");
  if($("bigArt"))$("bigArt").src=u;
  document.querySelectorAll("img[data-th]").forEach(im=>{im.src=u;});
  META.track=t;META.artist=a;META.topic=topic;
  return{idx,t,a,topic};
}

function buildDefaults(t,a,topic,dt){
  const dStr=dt||new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  const press=[
    "FOR IMMEDIATE RELEASE - "+dStr,
    "VEG ANNA RADIO LAUNCHES '"+t+"' BY "+a.toUpperCase()+" AS TODAY'S SINGLE OF THE DAY",
    "",
    "GLOBAL DAILY SINGLES LAUNCH CAMPAIGN: Independent media network and broadcaster Veg Anna Radio today officially premieres '"+t+"' by "+a+" as its featured Single of the Day. The release anchors an ongoing daily singles launch campaign built around one artist, one new song per day, and continuous global discovery across an expanding catalog of more than 100 original studio recordings and licensed tracks.",
    "",
    "ABOUT THE SINGLE AND SONG STORY: Centered on "+topic+", '"+t+"' blends story-driven songwriting, sharp observation, and radio-ready production. Rather than treating music as a disposable one-day upload, Veg Anna Radio pairs each daily single with dedicated radio intros, cover artwork, and searchable catalog documentation so listeners and music programmers worldwide can explore the narrative behind every release.",
    "",
    "WORLD RADIO BROADCAST FOOTPRINT: "+a+"'s catalog enjoys active world radio airplay reaching audiences across 10 countries: "+COUNTRIES+". Through continuous radio rotation and daily single premieres, international listeners experience each new release as part of a connected, living broadcast schedule.",
    "",
    "ABOUT "+a.toUpperCase()+": "+a+" is an Australian lyricist, songwriter, and composer, and a former Hollywood celebrity guitar technician who worked backstage for rock legends including Steve Jones of the Sex Pistols and Doug Fieger of The Knack before channeling his personal experiences into his own recording career. Operating independently without traditional major-label gatekeepers, his sprawling catalog spans radio rock, anti-pop, reggae, blues, and electronic dance floor remixes exploring modern life, freedom, rebellion, and love.",
    "",
    "DIRECT FAN OWNERSHIP AND NON-COMMERCIAL SHARING MODEL: Under the self-built artist-under-one-roof business model, listeners who purchase MP3 and cover art bundles own their files directly and are explicitly authorized to copy and share them freely with friends for non-commercial listening. Commercial resale, redistribution for profit, or unauthorized monetization of the audio files or artwork is strictly prohibited.",
    "",
    "MEDIA AND LISTENER CALL TO ACTION: Tune in to Veg Anna Radio to hear '"+t+"' in rotation, explore the 100+ song catalog, and support independent artist-owned music directly through the official links below:",
    "Official Artist Portfolio and Hub: "+HUB_URL,
    "Direct MP3 and Cover Art Bundle: "+BUNDLE_URL,
    "Stream on Apple Music: "+APPLE_URL,
    "Official YouTube Channel: "+YT_URL
  ].join("\n");
  return{
    djIntro:scrub("Good evening, music lovers! Somewhere on Earth right now, someone is turning up their speakers and hearing '"+t+"' by "+a+" for the very first time. Built around "+topic+", this is today's brand-new daily single premiere on Veg Anna Radio. Let's spin it!"),
    press:scrub(press),
    x:scrub("Major labels release once a quarter. "+a+" drops a new single every single day. Hear today's shockwave '"+t+"' ("+topic+"): "+APPLE_URL+" #martinstrayd").slice(0,275),
    tiktok:scrub("POV: You found the one song that sounds like "+topic+" running at 200 mph. '"+t+"' by "+a+" is today's daily single drop on Veg Anna Radio, built for late-night drives and creator edits. Full audio and art bundle: "+BUNDLE_URL+" #martinstrayd #newmusic #dailysingle #fyp #songrecommendation").slice(0,2200),
    instagram:scrub("Some songs feel like a midnight confession you did not know you needed. With '"+t+"', "+a+" turns "+topic+" into a vivid, unfiltered chapter of his 100+ song independent catalog on Veg Anna Radio. Listeners who collect the direct MP3 and cover art bundle at "+BUNDLE_URL+" own it outright and can share it freely with friends for non-commercial listening. #martinstrayd #veganaradio #storytelling #independentartist #dailysingle").slice(0,2200),
    facebook:scrub("Listeners tuning in from "+COUNTRIES+" are discovering today's Single of the Day on Veg Anna Radio: '"+t+"' by "+a+". What started as a bold song-a-day experiment has grown into a 100+ track independent catalog connecting radio audiences across ten nations. Explore the full catalog, stories, and direct artist hub at "+HUB_URL+" #martinstrayd #veganaradio #worldradio #independentmusic #dailysingle").slice(0,63206),
    ytTitle:scrub("Inside '"+t+"' by "+a+" | Story, Sound & Veg Anna Radio Daily Single").slice(0,95),
    ytDesc:scrub(t+" by "+a+" | Featured Single of the Day on Veg Anna Radio.\nTheme & Story: "+topic+". Discover "+a+", Australian lyricist, songwriter, composer, and former Hollywood celebrity guitar technician (Steve Jones of the Sex Pistols, Doug Fieger of The Knack), building a 100+ song independent daily singles catalog heard across "+COUNTRIES+".\nStream on Apple Music: "+APPLE_URL+"\nDirect MP3 & Cover Art Bundle (Own your copy and share freely with friends for non-commercial listening; commercial resale prohibited): "+BUNDLE_URL+"\nOfficial Artist Hub: "+HUB_URL+"\n#martinstrayd #veganaradio #dailysingle #independentmusic #newmusic").slice(0,5000)
  };
}

function applyDispatch(data){
  const cur=syncSong();
  const fb=buildDefaults(cur.t,cur.a,cur.topic,(data&&data.date)||"");
  const d=(data&&typeof data.dispatch==="object"&&data.dispatch)?data.dispatch:{};
  META.date=scrub((data&&data.date)||"");
  const pressRaw=scrub(d.press||"");
  const out={
    djIntro:scrub(d.djIntro||fb.djIntro),
    press:pressRaw.length>=1200?pressRaw:fb.press,
    x:scrub(d.x||fb.x).slice(0,280),
    tiktok:scrub(d.tiktok||fb.tiktok).slice(0,2200),
    instagram:scrub(d.instagram||fb.instagram).slice(0,2200),
    facebook:scrub(d.facebook||fb.facebook).slice(0,63206),
    ytTitle:scrub(d.ytTitle||fb.ytTitle).slice(0,100),
    ytDesc:scrub(d.ytDesc||fb.ytDesc).slice(0,5000)
  };
  setVal("djBox",out.djIntro);
  setVal("pressBox",out.press);
  CH.forEach(([id,,lim])=>{
    const v=String(out[id]||"").slice(0,lim);
    setVal("t_"+id,v);
    setTxt("c_"+id,v.length+" / "+lim);
  });
}

async function loadLatest(){
  setTxt("st","Syncing bible rules and live dispatch...");
  BIBLE_RULES=await fetchRepo("bible/000-bible.md");
  const raw=await fetchRepo("strayd/last-dahl-dispatch.json");
  if(!raw){applyDispatch({});setTxt("st","Ready with grounded dispatch");return;}
  try{
    const j=JSON.parse(raw);
    if(j&&j.track&&$("songSel")){
      const i=SONGS.findIndex(x=>scrub(x.title||x.name).toLowerCase()===scrub(j.track).toLowerCase());
      if(i>=0)$("songSel").value=String(i);
    }
    applyDispatch(j);
    setTxt("st","Loaded "+((j&&j.track)||"dispatch")+(j&&j.voice?" | MP3 voice: "+j.voice:"")+(BIBLE_RULES?" (Bible synced)":""));
  }catch(e){applyDispatch({});setTxt("st","Recovered: "+e.message);}
}

async function saveDispatch(){
  try{
    const cur=syncSong();
    const payload={
      date:META.date||new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}),
      track:cur.t,artist:cur.a,topic:cur.topic,api_status:"saved_from_dispatch_ui",
      dispatch:{
        djIntro:scrub($("djBox")&&$("djBox").value||""),
        press:scrub($("pressBox")&&$("pressBox").value||""),
        x:scrub($("t_x")&&$("t_x").value||"").slice(0,280),
        tiktok:scrub($("t_tiktok")&&$("t_tiktok").value||"").slice(0,2200),
        instagram:scrub($("t_instagram")&&$("t_instagram").value||"").slice(0,2200),
        facebook:scrub($("t_facebook")&&$("t_facebook").value||"").slice(0,63206),
        ytTitle:scrub($("t_ytTitle")&&$("t_ytTitle").value||"").slice(0,100),
        ytDesc:scrub($("t_ytDesc")&&$("t_ytDesc").value||"").slice(0,5000)
      }
    };
    const res=await putRepo("strayd/last-dahl-dispatch.json",JSON.stringify(payload,null,2),"edit(dispatch): save dispatch from dispatch.html");
    setTxt("st","Saved to GitHub -> "+(res.commit&&res.commit.sha?res.commit.sha.slice(0,7):"ok"));
  }catch(e){setTxt("st","Save failed: "+e.message);}
}

async function loadSongs(){
  const raw=await fetchRepo("strayd/songs-db.json");
  try{const d=JSON.parse(raw);SONGS=Array.isArray(d)?d:(d.songs||d.tracks||[]);}catch{}
  if(!SONGS.length)SONGS=[{title:"Adhd I Can Do That (Travillen Disorder)",artist:"Martin Strayd",topic:"unstoppable creative overdrive and modern life"}];
  const sel=$("songSel");
  if(sel){
    sel.innerHTML="";
    SONGS.forEach((x,i)=>{const o=document.createElement("option");o.value=i;o.textContent=(i+1)+" - "+(x.title||x.name||"Track");sel.appendChild(o);});
  }
  syncSong();
}

async function triggerAction(mode){
  const pat=getPat();
  if(!pat){setTxt("st","Paste GitHub PAT first to run GitHub Action");return;}
  const{idx,topic}=syncSong();
  const edgeVoice=mapToEdgeVoice(getSelectedVoice());
  const runMode=(mode==="render_mp3_only")?"render_mp3_only":"full";
  try{
    const r=await fetch("https://api.github.com/repos/agent-anna/home/actions/workflows/dahl-dispatch.yml/dispatches",{
      method:"POST",
      headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},
      body:JSON.stringify({ref:"main",inputs:{song_index:String(idx),angle:(($("angleIn")&&$("angleIn").value.trim())||topic),voice:edgeVoice,mode:runMode}})
    });
    if(!r.ok)throw new Error("HTTP "+r.status);
    setTxt("st","GitHub Action started ("+runMode+", voice="+edgeVoice+") - wait ~25s then click Load Live Dispatch");
  }catch(e){setTxt("st","Action failed: "+e.message);}
}

function mapToEdgeVoice(v){
  const n=((v&&v.name)||"").toLowerCase();
  const l=((v&&v.lang)||"").toLowerCase();
  if(/jenny/.test(n))return"en-US-JennyNeural";
  if(/aria/.test(n))return"en-US-AriaNeural";
  if(/sonia/.test(n))return"en-GB-SoniaNeural";
  if(/libby/.test(n))return"en-GB-LibbyNeural";
  if(/natasha/.test(n))return"en-AU-NatashaNeural";
  if(/clara/.test(n))return"en-CA-ClaraNeural";
  if(/guy/.test(n))return"en-US-GuyNeural";
  if(/ryan/.test(n))return"en-GB-RyanNeural";
  if(/william/.test(n))return"en-AU-WilliamNeural";
  if(/zira|samantha|victoria|hazel|susan|heera|female|woman/.test(n)){
    if(l.startsWith("en-gb"))return"en-GB-SoniaNeural";
    if(l.startsWith("en-au"))return"en-AU-NatashaNeural";
    return"en-US-JennyNeural";
  }
  if(/david|mark|george|daniel|james|male|man/.test(n)){
    if(l.startsWith("en-gb"))return"en-GB-RyanNeural";
    if(l.startsWith("en-au"))return"en-AU-WilliamNeural";
    return"en-US-GuyNeural";
  }
  if(l.startsWith("en-gb"))return"en-GB-SoniaNeural";
  if(l.startsWith("en-au"))return"en-AU-NatashaNeural";
  return"en-US-JennyNeural";
}

function getSelectedVoice(){
  const sel=$("voiceSel");
  const list=("speechSynthesis"in window)?(speechSynthesis.getVoices()||[]):[];
  if(!sel)return list[0]||VOICES[0]||null;
  const opt=sel.options[sel.selectedIndex];
  const wn=opt?opt.dataset.vname:"";const wl=opt?opt.dataset.vlang:"";
  if(wn){const m=list.find(v=>v.name===wn&&(!wl||v.lang===wl));if(m)return m;}
  return list[Number(sel.value||0)]||VOICES[Number(sel.value||0)]||list[0]||null;
}

function popV(){
  if(!("speechSynthesis"in window))return;
  const list=speechSynthesis.getVoices()||[];
  if(!list.length)return;
  const prev=getSelectedVoice();
  VOICES=list.slice();
  const sel=$("voiceSel");
  if(!sel)return;
  sel.innerHTML="";
  VOICES.forEach((v,i)=>{
    const o=document.createElement("option");
    o.value=String(i);o.dataset.vname=v.name;o.dataset.vlang=v.lang;
    o.textContent=v.name+" ("+v.lang+")";
    if(prev&&v.name===prev.name&&v.lang===prev.lang)o.selected=true;
    sel.appendChild(o);
  });
}

function cleanSpeech(t){return scrub(String(t||"")).replace(/https?:\/\/\S+/g," ").replace(/#[A-Za-z0-9_]+/g," ").replace(/\s+/g," ").trim();}

function speakTxt(t,announceOnly){
  if(!("speechSynthesis"in window))return;
  const sp=announceOnly?String(t||"").trim():cleanSpeech(t).slice(0,2400);
  if(!sp)return;
  if(!VOICES.length)popV();
  try{speechSynthesis.cancel();}catch{}
  const voice=getSelectedVoice();
  const parts=announceOnly?[sp]:(sp.match(/[^.!?]+[.!?]?/g)||[sp]).slice(0,18);
  parts.forEach(pt=>{
    const c=pt.trim();if(!c)return;
    const u=new SpeechSynthesisUtterance(c);
    if(voice){u.voice=voice;if(voice.lang)u.lang=voice.lang;}
    speechSynthesis.speak(u);
  });
}

function makeWav(text){
  const sr=16000,dur=Math.min(10,Math.max(1.5,cleanSpeech(text).split(/\s+/).length/6)),n=Math.floor(sr*dur);
  const buf=new ArrayBuffer(44+n*2),view=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");view.setUint32(4,36+n*2,true);ws(8,"WAVE");ws(12,"fmt ");view.setUint32(16,16,true);
  view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,sr,true);view.setUint32(28,sr*2,true);
  view.setUint16(32,2,true);view.setUint16(34,16,true);ws(36,"data");view.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    const env=Math.min(1,i/(sr*0.05))*Math.min(1,(n-i)/(sr*0.05));
    const s16=Math.max(-32768,Math.min(32767,Math.floor(Math.sin(2*Math.PI*220*(i/sr))*0.06*env*32767)));
    view.setInt16(44+i*2,s16,true);
  }
  return new Blob([buf],{type:"audio/wav"});
}

async function dlAudio(t,base){
  const sp=cleanSpeech(t).slice(0,400);
  if(!sp){setTxt("st","Nothing to save");return;}
  speakTxt(sp,false);
  const v=getSelectedVoice();
  const vn=v&&/amy|emma|aria|jenny|sonia|samantha|victoria|zira/i.test(v.name)?v.name.split(" ")[0]:"Amy";
  try{
    const r=await fetch("https://api.streamelements.com/kappa/v2/speech?voice="+encodeURIComponent(vn)+"&text="+encodeURIComponent(sp));
    if(!r.ok)throw new Error("HTTP "+r.status);
    const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement("a");
    a.href=u;a.download=base+".mp3";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);setTxt("st","Downloaded "+base+".mp3");
  }catch{
    const w=makeWav(sp);const u=URL.createObjectURL(w);const a=document.createElement("a");
    a.href=u;a.download=base+".wav";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);setTxt("st","Saved "+base+".wav");
  }
}

function dlTxtFile(t,base){
  const b=new Blob([String(t||"")],{type:"text/plain;charset=utf-8"});
  const u=URL.createObjectURL(b);const a=document.createElement("a");
  a.href=u;a.download=base+".txt";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);setTxt("st","Downloaded "+base+".txt");
}

function cpyTxt(t,lbl){navigator.clipboard?.writeText(String(t||""));setTxt("st","Copied "+lbl);}
