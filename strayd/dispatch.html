let SONGS = [];

function getPat() {
  const el = document.getElementById("patInput");
  return ((el && el.value) || localStorage.getItem("antipop_gh_pat_v1") || "").trim();
}

function decodeBase64Utf8(b64) {
  const clean = String(b64 || "").replace(/\s+/g, "");
  if (!clean) return "";
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

async function fetchRepoFile(repoPath) {
  const cleanPath = String(repoPath || "").replace(/^\/+/, "");
  if (!cleanPath.startsWith("bible/") && !cleanPath.startsWith("strayd/")) return "";

  const pat = getPat();
  if (pat) {
    try {
      const apiUrl = "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + encodeURI(cleanPath) + "?ref=" + REPO_BRANCH + "&t=" + Date.now();
      const r = await fetch(apiUrl, {
        headers: { Authorization: "Bearer " + pat, Accept: "application/vnd.github+json" },
        cache: "no-store"
      });
      if (r.ok) {
        const meta = await r.json();
        if (meta && meta.content) return decodeBase64Utf8(meta.content);
        if (meta && meta.download_url) {
          const dr = await fetch(meta.download_url + (meta.download_url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
          if (dr.ok) return await dr.text();
        }
      }
    } catch (_) {}
  }

  const bases = [
    "https://raw.githubusercontent.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + REPO_BRANCH + "/",
    "https://" + REPO_OWNER + ".github.io/" + REPO_NAME + "/"
  ];
  for (const base of bases) {
    try {
      const r = await fetch(base + encodeURI(cleanPath) + "?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) return await r.text();
    } catch (_) {}
  }
  return "";
}

async function loadBibleCorpus() {
  const indexText = await fetchRepoFile("bible/00-bible-index.md");
  const docNames = ["00-bible-index.md"];
  const matches = indexText.match(/bible\/[A-Za-z0-9_.-]+\.md/g) || [];
  matches.forEach(m => {
    const base = m.split("/").pop();
    if (base && !docNames.includes(base)) docNames.push(base);
  });
  ["dispatch-essentials.md", "04-voice-and-broadcast-law.md", "06-dj-anna-persona.md", "07-platform-cadence-and-hashtags.md"].forEach(base => {
    if (!docNames.includes(base)) docNames.push(base);
  });

  const entries = await Promise.all(docNames.slice(0, 12).map(async name => {
    const txt = await fetchRepoFile("bible/" + name);
    return [name, (txt || "").trim()];
  }));

  BIBLE_DOCS = {};
  entries.forEach(([k, v]) => {
    if (v && v.length > 2) BIBLE_DOCS[k] = v;
  });

  const brainRaw = await fetchRepoFile("strayd/record-brain.json");
  if (brainRaw) {
    try { RECORD_BRAIN = JSON.parse(brainRaw.replace(/^\uFEFF/, "")); } catch (_) {}
  }

  const loadedKeys = Object.keys(BIBLE_DOCS);
  document.getElementById("bibleBanner").textContent = loadedKeys.length
    ? ("Bible loaded from bible/ (" + loadedKeys.length + " files): " + loadedKeys.join(", "))
    : "Bible source: no bible/ files loaded yet (add GitHub PAT and click Load).";
}

function scrubSpoken(str) {
  return String(str || "")
    .replace(/https?:\/\/\S+/gi, "")
    .replace(/[=*_~#]{2,}/g, " ")
    .replace(/[\u2013\u2014]/g, ", ")
    .replace(/\bDJ\s+Bananna\b/gi, "Veg Anna")
    .replace(/\bDJ\s+Veg\s+Anna\b/gi, "Veg Anna")
    .replace(/([!?.])\1{2,}/g, "$1")
    .replace(/[ \t]+/g, " ")
    .trim();
}

function scrubCopy(str) {
  return String(str || "")
    .replace(/https?:\/\/music\.apple\.com\/\S+/gi, "")
    .replace(/https?:\/\/tinyurl\.com\/\S+/gi, "")
    .replace(/\bDJ\s+Bananna\b/gi, "Veg Anna")
    .replace(/\bDJ\s+Veg\s+Anna\b/gi, "Veg Anna")
    .replace(/[\u2013\u2014]/g, " - ")
    .replace(/[ \t]+/g, " ")
    .trim();
}

function smartTrimStr(str, maxLen) {
  const s = scrubCopy(str);
  if (s.length <= maxLen) return s;
  const cut = s.slice(0, maxLen - 1);
  const sp = cut.lastIndexOf(" ");
  return (sp > 20 ? cut.slice(0, sp) : cut).trim();
}

function extractBibleSignals() {
  const combined = Object.values(BIBLE_DOCS).join("\n");
  const lines = combined
    .split(/\r?\n/)
    .map(l => l.replace(/^[-*#\s]+/, "").trim())
    .filter(l => l.length > 20 && l.length < 190 && !/^===/.test(l) && !/https?:\/\//i.test(l));
  if (!lines.length) return [];
  const baseIdx = (NONCE - 1) % lines.length;
  return [
    lines[baseIdx],
    lines[(baseIdx + 2) % lines.length],
    lines[(baseIdx + 5) % lines.length],
    lines[(baseIdx + 9) % lines.length]
  ].filter(Boolean);
}

function getSelectedSong() {
  if (!SONGS.length) {
    return {
      idx: 0,
      id: "",
      title: "",
      artist: (RECORD_BRAIN && RECORD_BRAIN.artist) || "Martin Strayd",
      topic: scrubCopy((document.getElementById("topicInput").value || "").trim()),
      cover: "",
      cleanLink: "",
      genre: ""
    };
  }
  const sel = document.getElementById("songSel");
  const idx = sel ? parseInt(sel.value || "0", 10) : 0;
  const s = SONGS[idx] || SONGS[0];
  const am = (s && s.platforms && s.platforms.appleMusic) || {};
  const customTopic = (document.getElementById("topicInput").value || "").trim();
  const autoTopic = [am.genre, s.promoStatus, s.id].filter(Boolean).join(" | ");
  const rawPortal = String(s.portalUrl || (RECORD_BRAIN && RECORD_BRAIN.salesPortal) || "").trim();
  const cleanLink = rawPortal && !/music\.apple\.com|tinyurl\.com|strayd\.com/i.test(rawPortal) ? rawPortal : "";

  return {
    idx: isNaN(idx) ? 0 : idx,
    id: s.id || "",
    title: scrubCopy(s.title || s.name || ""),
    artist: scrubCopy(s.artist || (RECORD_BRAIN && RECORD_BRAIN.artist) || "Martin Strayd"),
    topic: scrubCopy(customTopic || s.topic || s.theme || s.mood || autoTopic || ""),
    cover: am.artworkUrlHighRes || s.artUrl || s.cover || s.artwork || s.art || "",
    cleanLink,
    genre: am.genre || ""
  };
}

function syncSong() {
  const cur = getSelectedSong();
  const img = document.getElementById("coverImg");
  const ph = document.getElementById("coverPlaceholder");
  if (cur.cover) {
    img.src = cur.cover;
    img.classList.remove("hidden");
    ph.classList.add("hidden");
  } else {
    img.removeAttribute("src");
    img.classList.add("hidden");
    ph.classList.remove("hidden");
  }
  return cur;
}

  document.getElementById("igText").value = smartTrimStr(out.instagram || "", 2200);
  document.getElementById("fbText").value = smartTrimStr(out.facebook || "", 63206);
  document.getElementById("ytTitleText").value = smartTrimStr(out.ytTitle || "", 95);
  document.getElementById("ytDescText").value = smartTrimStr(out.ytDesc || "", 5000);
}

async function generateFreshDispatchFromBible(cur) {
  if (!cur.title) {
    writeDispatchFields({ djIntro: "", press: "", x: "", tiktok: "", instagram: "", facebook: "", ytTitle: "", ytDesc: "" });
    return;
  }

  const pat = getPat();
  if (pat) {
    try {
      await fetch("https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/actions/workflows/dahl-dispatch.yml/dispatches", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + pat,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          ref: REPO_BRANCH,
          inputs: {
            track: cur.title,

            topic: cur.topic || "daily single release",

    angle + ". " +
    (s0 ? (s0 + ". ") : "") +

    "Track: " + cur.title + "\n" +
    "Artist: " + cur.artist + "\n" +
    "Rollout: 365-Day Daily Single Drop\n\n" +
    "WHO & WHAT: " + cur.artist + " unveils the daily single \"" + cur.title + "\" on ANTIPOP, hosted live by DJ ANNA with angle focus: " + angle + ".\n\n" +
    "WHY IT MATTERS: " + (s0 || angle) + (s1 ? (" " + s1) : "") + "\n\n" +
    "CONTEXT & MOMENTUM: " + (s2 || "Daily single cadence built for consistent listener discovery.") + (s3 ? (" " + s3) : "") + "\n\n" +
    "CALL TO ACTION: Stream, share, and explore the artist release directly" + (ctaLink ? (":" + ctaLink) : ".");

  const xPost =
    "SINGLE OF THE DAY: " + cur.title + " - " + cur.artist + ". " +
    angle + ". " +
    (s0 ? smartTrimStr(s0, 95) + " " : "") +
    (cur.cleanLink || "");

  const tiktokPost =
    "Hook: Today's single drop is \"" + cur.title + "\" by " + cur.artist + " on the 365-day daily release run.\n" +
    "Why listen now: " + (s0 || angle) + "\n" +
    "CTA: Tap in and catch the daily drop" + (ctaLink ? (":" + ctaLink) : ".");

  const igPost =
    cur.title + " - " + cur.artist + " | Single of the Day (365-Day Daily Drop)\n\n" +
    angle + "\n" +
    (s0 ? (s0 + "\n") : "") +
    (s1 ? (s1 + "\n") : "") +
    "CTA: Check today's release" + (ctaLink ? (":" + ctaLink) : ".");

  const fbPost =
    "SINGLE OF THE DAY: " + cur.title + " by " + cur.artist + "\n" +
    "Daily Release Focus: " + angle + "\n\n" +
    (s0 ? (s0 + "\n") : "") +
    (s1 ? (s1 + "\n") : "") +
    (s2 ? (s2 + "\n") : "") +
    "\nCTA: Hear today's single and follow the 365-day daily release" + (ctaLink ? (":" + ctaLink) : ".");

  const ytTitle = cur.title + " - " + cur.artist + " | Single of the Day";
  const ytDesc =
    "Single of the Day: " + cur.title + " by " + cur.artist + "\n" +
    "365-Day Daily Release Drop | Angle: " + angle + "\n\n" +
    (s0 ? (s0 + "\n") : "") +

  writeDispatchFields({

function cleanVoiceDisplayLabel(rawLabel) {
  return String(rawLabel || "")
    .replace(/\s*\[[^\]]+\]\s*$/g, "")
    .replace(/^(?:sys|edge):/i, "")
    .trim();
}

function populateVoices() {
  const sel = document.getElementById("voiceSel");
  const savedVal = localStorage.getItem("antipop_voice_v1") || "";
  const savedLbl = localStorage.getItem("antipop_voice_label_v1") || "";
  const sysVoices = (window.speechSynthesis && window.speechSynthesis.getVoices) ? window.speechSynthesis.getVoices() : [];
  const seen = new Set();
  const options = [];

  sysVoices.forEach(v => {
    const key = "sys:" + v.name + "|" + v.lang;
    if (!seen.has(key)) {
      seen.add(key);
      options.push({ value: "sys:" + v.name, label: v.name + " (" + v.lang + ")" });
    }
  });
  EDGE_VOICE_CATALOG.forEach(([edgeName, label]) => {
    const key = "edge:" + edgeName;
    if (!seen.has(key)) {
      seen.add(key);
      options.push({ value: "edge:" + edgeName, label: label + " [" + edgeName + "]" });
    }
  });

  sel.innerHTML = "";
  options.forEach(o => {
    const opt = document.createElement("option");
    opt.value = o.value;
    opt.textContent = o.label;
    sel.appendChild(opt);
  });

  if (savedVal && Array.from(sel.options).some(o => o.value === savedVal)) {
    sel.value = savedVal;
  } else if (savedLbl) {
    const matchByLabel = Array.from(sel.options).find(o => cleanVoiceDisplayLabel(o.textContent) === savedLbl);
    if (matchByLabel) sel.value = matchByLabel.value;
    else if (sel.options.length > 0) sel.selectedIndex = 0;
  } else if (sel.options.length > 0) {
    sel.selectedIndex = 0;
  }
}

function persistSelectedVoice(showMsg) {
  const voiceEl = document.getElementById("voiceSel");
  if (!voiceEl) return;
  const chosenOpt = voiceEl.options[voiceEl.selectedIndex];
  const cleanName = cleanVoiceDisplayLabel(chosenOpt ? chosenOpt.textContent : voiceEl.value);
  localStorage.setItem("antipop_voice_v1", voiceEl.value);
  localStorage.setItem("antipop_voice_label_v1", cleanName);
  if (showMsg) setStatus("Voice saved: " + cleanName);
}

function resolveSpeechProfile(selVal, sysVoices) {
  if (selVal.startsWith("sys:")) {
    const targetName = selVal.slice(4);
    const voice = sysVoices.find(v => v.name === targetName) || null;
    const isMale = /\b(male|man|david|mark|daniel|arthur|george|ryan|steffan|roger|liam|aarav|niwat|keita|henri|conrad|diego)\b/i.test(targetName);
    return {
      voice,
      edgeVoiceName: "",
      lang: (voice && voice.lang) || "en-US",
      pitch: isMale ? 0.88 : 1.06,
      rate: isMale ? 0.96 : 1.0,
      label: voice ? voice.name : targetName
    };
  }

  if (selVal.startsWith("edge:")) {
    const edgeName = selVal.slice(5);
    const catalogEntry = EDGE_VOICE_CATALOG.find(([id]) => id === edgeName);
    const labelText = catalogEntry ? catalogEntry[1] : edgeName;
    const localeMatch = labelText.match(/\(([^)]+)\)/) || edgeName.match(/^([a-z]{2,3}-[A-Z]{2})/);
    const targetLang = localeMatch ? localeMatch[1] : "en-US";
    const langPrefix = targetLang.split("-")[0].toLowerCase();
    const shortName = labelText.split(" ")[0].toLowerCase();
    const isMale = MALE_EDGE_NAMES.has(edgeName);

    const exactLangVoices = sysVoices.filter(v => String(v.lang || "").toLowerCase() === targetLang.toLowerCase());
    const prefixLangVoices = sysVoices.filter(v => String(v.lang || "").toLowerCase().startsWith(langPrefix + "-"));
    const pool = exactLangVoices.length ? exactLangVoices : prefixLangVoices;

    const byName = pool.find(v => String(v.name || "").toLowerCase().includes(shortName));
    const genderRx = isMale
      ? /\b(male|man|david|mark|daniel|arthur|george|ryan|steffan|roger|liam|aarav|niwat|keita|henri|conrad|diego)\b/i
      : /\b(female|woman|aria|luna|jenny|michelle|sonia|natasha|clara|samantha|victoria|zira|premwadee|nanami|sunhi|elvira|denise|katja|isabella|francisca|salma)\b/i;

    const voice =
      byName ||
      pool.find(v => genderRx.test(v.name || "")) ||
      pool[0] ||
      sysVoices.find(v => /^en/i.test(v.lang || "")) ||
      sysVoices[0] ||
      null;

    return {
      voice,
      edgeVoiceName: edgeName,
      lang: targetLang,
      pitch: isMale ? 0.86 : 1.05,
      rate: isMale ? 0.96 : 1.0,
      label: labelText
    };
  }

  const fallbackVoice = sysVoices.find(v => /^en/i.test(v.lang || "")) || sysVoices[0] || null;
  return {
    voice: fallbackVoice,
    edgeVoiceName: "",
    lang: (fallbackVoice && fallbackVoice.lang) || "en-US",
    pitch: 1.02,
    rate: 0.98,
    label: fallbackVoice ? fallbackVoice.name : "Default"
  };
}

function speakText(text) {
  const clean = scrubSpoken(text);
  if (!clean) {
    setStatus("Nothing to speak");
    return;
  }
  if (!("speechSynthesis" in window)) {
    setStatus("Speech synthesis unavailable in browser");
    return;
  }
  const selVal = document.getElementById("voiceSel").value || "";
  const sysVoices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
  const profile = resolveSpeechProfile(selVal, sysVoices);

  window.speechSynthesis.cancel();
  const chunks = clean.match(/[^.!?]+[.!?]*\s*/g) || [clean];
  chunks.forEach(ch => {
    const part = ch.trim();
    if (!part) return;
    const u = new SpeechSynthesisUtterance(part);
    if (profile.voice) u.voice = profile.voice;
    u.lang = profile.lang;
    u.rate = profile.rate;
    u.pitch = profile.pitch;
    u.onend = () => setStatus("Finished speaking (" + profile.label + ")");
    window.speechSynthesis.speak(u);
  });
  setStatus("Speaking (" + profile.label + ")...");
}

async function downloadMp3File(text, baseName, repoAudioPath) {
  const clean = scrubSpoken(text).slice(0, 450);
  const selVal = document.getElementById("voiceSel").value || "";
  const sysVoices = (window.speechSynthesis && window.speechSynthesis.getVoices) ? window.speechSynthesis.getVoices() : [];
  const profile = resolveSpeechProfile(selVal, sysVoices);
  const voiceKey = profile.edgeVoiceName
    ? profile.edgeVoiceName.replace(/Neural$/i, "")
    : (profile.voice && profile.voice.name ? profile.voice.name : "Aria");

  setStatus("Fetching MP3 (" + profile.label + ")...");
  try {
    if (clean) {
      const resp = await fetch("https://api.streamelements.com/kappa/v2/speech?voice=" + encodeURIComponent(voiceKey) + "&text=" + encodeURIComponent(clean));
      if (resp.ok) {
        const blob = await resp.blob();
        if (blob && blob.size > 200 && /audio|octet-stream/i.test(blob.type || "audio/mpeg")) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = baseName + ".mp3";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          setStatus("Downloaded " + baseName + ".mp3 (" + profile.label + ")");
          return;
        }
      }
    }
    if (repoAudioPath) {
      const mp3Url = "https://raw.githubusercontent.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + REPO_BRANCH + "/" + repoAudioPath + "?t=" + Date.now();
      const mr = await fetch(mp3Url);
      if (mr.ok) {
        const mblob = await mr.blob();
        if (mblob && mblob.size > 200) {
          const url = URL.createObjectURL(mblob);
          const a = document.createElement("a");
          a.href = url;
          a.download = baseName + ".mp3";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          setStatus("Downloaded " + baseName + ".mp3 from " + repoAudioPath);
          return;
        }
      }
    }
    throw new Error("No MP3 stream available");
  } catch (err) {
    setStatus("MP3 unavailable (" + (err && err.message ? err.message : "check GitHub/TTS") + ") — speaking aloud");
    speakText(clean);
  }
}

function copyVal(id, label) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.value || "").then(() => setStatus("Copied " + (label || id)));
}

function postSocialCard(platform, id) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = scrubCopy(el.value || "");
  if (!text) {
    setStatus("Nothing to post for " + platform);
    return;
  }
  if (navigator.share) {
    navigator.share({ text }).then(() => setStatus("Posted via share sheet: " + platform)).catch(() => {
      navigator.clipboard.writeText(text).catch(() => {});
      setStatus("Copied " + platform + " post");
    });
  } else {
    navigator.clipboard.writeText(text).catch(() => {});
    setStatus("Copied " + platform + " post");
  }
}

async function loadCatalogAndDispatch() {
  setStatus("Loading bible/ & catalog...");
  await loadBibleCorpus();

  try {
    const rawCatalog = await fetchRepoFile("strayd/songs-db.json");
    if (rawCatalog) {
      const parsed = JSON.parse(rawCatalog.replace(/^\uFEFF/, ""));
      SONGS = Array.isArray(parsed) ? parsed : (parsed.songs || parsed.tracks || []);
    }
  } catch (_) {}

  const sel = document.getElementById("songSel");
  sel.innerHTML = "";
  if (SONGS.length > 0) {
    SONGS.forEach((s, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = (i + 1) + ". " + scrubCopy(s.title || s.name || ("Track " + (i + 1)));
      sel.appendChild(opt);
    });
    sel.value = "0";
    document.getElementById("catalogStatus").textContent = "ANTIPOP Daily Dispatch (" + SONGS.length + " songs)";
  } else {
    document.getElementById("catalogStatus").textContent = "Catalog unavailable (songs-db.json)";
  }

  const cur = syncSong();
  await generateFreshDispatchFromBible(cur);
  setStatus("Ready");
}

function wireSocialCards() {
  document.querySelectorAll("#socialCardsGrid .card").forEach(card => {
    const platform = card.dataset.platform || "Post";
    const targetId = card.dataset.target;
    const audioPath = card.dataset.audio || "";
    const ta = document.getElementById(targetId);
    if (!ta) return;

    card.addEventListener("click", e => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === "speak") {
        speakText(ta.value);
      } else if (act === "dlAudio") {
        downloadMp3File(ta.value, "antipop-" + platform.toLowerCase().replace(/[^a-z0-9]+/g, "-"), audioPath);
      } else if (act === "edit") {
        ta.readOnly = false;
        ta.focus();
        setStatus("Editing " + platform);
      } else if (act === "save") {
        ta.readOnly = true;
        ta.value = scrubCopy(ta.value);
        setStatus("Saved " + platform);
      } else if (act === "copy") {
        copyVal(targetId, platform);
      } else if (act === "post") {
        postSocialCard(platform, targetId);
      }
    });
  });
}

function wireUI() {
  const patEl = document.getElementById("patInput");
  patEl.value = localStorage.getItem("antipop_gh_pat_v1") || "";
  patEl.addEventListener("change", () => localStorage.setItem("antipop_gh_pat_v1", patEl.value.trim()));

  const voiceEl = document.getElementById("voiceSel");
  voiceEl.addEventListener("change", () => persistSelectedVoice(true));

  document.getElementById("songSel").addEventListener("change", async () => {
    NONCE++;
    const cur = syncSong();
    await generateFreshDispatchFromBible(cur);
  });
  document.getElementById("topicInput").addEventListener("input", async () => {
    NONCE++;
    const cur = syncSong();
    await generateFreshDispatchFromBible(cur);
  });
  document.getElementById("loadBtn").addEventListener("click", () => {
    NONCE++;
    loadCatalogAndDispatch();
  });
  document.getElementById("saveBtn").addEventListener("click", () => {
    persistSelectedVoice(false);
    if (patEl.value.trim()) localStorage.setItem("antipop_gh_pat_v1", patEl.value.trim());
    setStatus("Saved voice & settings");
  });
  document.getElementById("renderBtn").addEventListener("click", async () => {
    NONCE++;
    setStatus("Pulling bible/ & generating fresh dispatch...");
    await loadBibleCorpus();
    const cur = syncSong();
    await generateFreshDispatchFromBible(cur);
    await downloadMp3File(document.getElementById("djIntroText").value, "antipop-dj-intro", "strayd/audio/djIntro.mp3");
  });
  document.getElementById("stopSpeechBtn").addEventListener("click", () => {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    setStatus("Speech stopped");
  });

  document.getElementById("speakIntroBtn").addEventListener("click", () => speakText(document.getElementById("djIntroText").value));
  document.getElementById("speakPressBtn").addEventListener("click", () => speakText(document.getElementById("pressText").value));
  document.getElementById("dlIntroBtn").addEventListener("click", () => downloadMp3File(document.getElementById("djIntroText").value, "antipop-dj-intro", "strayd/audio/djIntro.mp3"));
  document.getElementById("dlPressBtn").addEventListener("click", () => downloadMp3File(document.getElementById("pressText").value, "antipop-press-release", "strayd/audio/press.mp3"));
  document.getElementById("copyIntroBtn").addEventListener("click", () => copyVal("djIntroText", "DJ Intro"));
  document.getElementById("copyPressBtn").addEventListener("click", () => copyVal("pressText", "Press Release"));

  wireSocialCards();
}

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = populateVoices;
}
populateVoices();
wireUI();
loadCatalogAndDispatch();
</script>
