<!DOCTYPE html>

<style>
  :root {
    --bg: #0b0e13;
    --panel: #121720;
    --panel-2: #18202c;
    --border: #263142;
    --text: #e6edf7;

  * { box-sizing: border-box; }

    margin: 0;
    background: var(--bg);
    color: var(--text);

    line-height: 1.5;

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-weight: 600;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .top-grid {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 720px) { .top-grid { grid-template-columns: 1fr; } }
  .art-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }
  .art-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1, h2, h3 { margin: 0 0 8px 0; font-weight: 700; }
  h1 { font-size: 24px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  select, input[type="text"], input[type="password"], textarea {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea[readonly] { opacity: 0.92; background: #10151d; }
  textarea { min-height: 110px; resize: vertical; }
  textarea.press-area { min-height: 220px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-save { background: var(--accent-2); border-color: var(--accent-2); color: #07130b; }
  .status { font-size: 13px; color: var(--accent-2); margin-left: 4px; }
  .card-head {
    display: flex;

    align-items: center;

  .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 14px; }
  .hidden { display: none !important; }

function getPat() {
  const el = document.getElementById("patInput");
  return ((el && el.value) || localStorage.getItem("antipop_gh_pat_v1") || "").trim();
}

function decodeBase64Utf8(b64) {
  const clean = String(b64 || "").replace(/\s+/g, "");
  if (!clean) return "";
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

async function fetchRepoFile(repoPath) {
  const cleanPath = String(repoPath || "").replace(/^\/+/, "");
  if (!cleanPath.startsWith("bible/") && !cleanPath.startsWith("strayd/")) return "";

  const pat = getPat();
  if (pat) {
    try {
      const apiUrl = "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + encodeURI(cleanPath) + "?ref=" + REPO_BRANCH + "&t=" + Date.now();
      const r = await fetch(apiUrl, {
        headers: { Authorization: "Bearer " + pat, Accept: "application/vnd.github+json" },
        cache: "no-store"
      });
      if (r.ok) {
        const meta = await r.json();
        if (meta && meta.content) return decodeBase64Utf8(meta.content);
        if (meta && meta.download_url) {
          const dr = await fetch(meta.download_url + (meta.download_url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
          if (dr.ok) return await dr.text();
        }
      }
    } catch (_) {}
  }

  const bases = [
    "https://raw.githubusercontent.com/" + REPO_OWNER + "/" + REPO_NAME + "/" + REPO_BRANCH + "/",
    "https://" + REPO_OWNER + ".github.io/" + REPO_NAME + "/"
  ];
  for (const base of bases) {
    try {
      const r = await fetch(base + encodeURI(cleanPath) + "?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) return await r.text();
    } catch (_) {}
  }
  return "";
}

async function loadBibleCorpus() {
  const indexText = await fetchRepoFile("bible/00-bible-index.md");
  const docNames = ["00-bible-index.md"];
  const matches = indexText.match(/bible\/[A-Za-z0-9_.-]+\.md/g) || [];
  matches.forEach(m => {
    const base = m.split("/").pop();
    if (base && !docNames.includes(base)) docNames.push(base);
  });
  ["dispatch-essentials.md", "04-voice-and-broadcast-law.md", "06-dj-anna-persona.md", "07-platform-cadence-and-hashtags.md"].forEach(base => {
    if (!docNames.includes(base)) docNames.push(base);
  });

  const entries = await Promise.all(docNames.slice(0, 12).map(async name => {
    const txt = await fetchRepoFile("bible/" + name);
    return [name, (txt || "").trim()];
  }));

  BIBLE_DOCS = {};
  entries.forEach(([k, v]) => {
    if (v && v.length > 2) BIBLE_DOCS[k] = v;
  });

  const brainRaw = await fetchRepoFile("strayd/record-brain.json");
  if (brainRaw) {
    try { RECORD_BRAIN = JSON.parse(brainRaw.replace(/^\uFEFF/, "")); } catch (_) {}
  }

  const loadedKeys = Object.keys(BIBLE_DOCS);
  document.getElementById("bibleRulesView").textContent = loadedKeys.length
    ? loadedKeys.map(k => "=== bible/" + k + " ===\n" + BIBLE_DOCS[k]).join("\n\n")
    : "No bible/ markdown files loaded yet.";
}

function scrub(str) {
  return String(str || "")
    .replace(/[\u2013\u2014]/g, ", ")
    .replace(/\bDJ\s+Bananna\b/gi, "Veg Anna")
    .replace(/\bDJ\s+Veg\s+Anna\b/gi, "Veg Anna")
    .replace(/([!?.])\1{2,}/g, "$1")
    .replace(/[ \t]+/g, " ")
    .trim();
}

function smartTrimStr(str, maxLen) {
  const s = scrub(str);
  if (s.length <= maxLen) return s;
  const cut = s.slice(0, maxLen - 1);
  const sp = cut.lastIndexOf(" ");
  return (sp > 20 ? cut.slice(0, sp) : cut).trim();
}

function getSelectedSong() {
  if (!SONGS.length) {
    return {
      idx: 0,
      id: "",
      title: "",
      artist: (RECORD_BRAIN && RECORD_BRAIN.artist) || "Martin Strayd",
      topic: scrub((document.getElementById("topicInput").value || "").trim()),
      cover: "",
      portalUrl: "",
      appleUrl: "",
      genre: ""
    };
  }
  const sel = document.getElementById("songSel");
  const idx = sel ? parseInt(sel.value || "0", 10) : 0;
  const s = SONGS[idx] || SONGS[0];
  const am = (s && s.platforms && s.platforms.appleMusic) || {};
  const customTopic = (document.getElementById("topicInput").value || "").trim();
  const autoTopic = [am.genre, s.promoStatus, s.id].filter(Boolean).join(" | ");
  return {
    idx: isNaN(idx) ? 0 : idx,
    id: s.id || "",
    title: scrub(s.title || s.name || ""),
    artist: scrub(s.artist || (RECORD_BRAIN && RECORD_BRAIN.artist) || "Martin Strayd"),
    topic: scrub(customTopic || s.topic || s.theme || s.mood || autoTopic || ""),
    cover: am.artworkUrlHighRes || s.artUrl || s.cover || s.artwork || s.art || "",
    portalUrl: s.portalUrl || (RECORD_BRAIN && RECORD_BRAIN.salesPortal) || "",
    appleUrl: am.url || "",
    genre: am.genre || ""
  };
}

function syncSong() {
  const cur = getSelectedSong();
  const img = document.getElementById("coverImg");
  const ph = document.getElementById("coverPlaceholder");
  if (cur.cover) {
    img.src = cur.cover;
    img.classList.remove("hidden");
    ph.classList.add("hidden");
  } else {
    img.removeAttribute("src");
    img.classList.add("hidden");
    ph.classList.remove("hidden");
  }
  const bibleCount = Object.keys(BIBLE_DOCS).length;
  document.getElementById("studioSummary").textContent = cur.title
    ? ("Track " + (cur.idx + 1) + "/" + SONGS.length + ": " + cur.title + " (" + cur.artist + ") | bible/ docs: " + bibleCount + " | Run #" + NONCE)
    : ("bible/ docs: " + bibleCount + " | Run #" + NONCE);
  return cur;
}

  document.getElementById("tiktokText").value = smartTrimStr(out.tiktok || "", 2200);
  document.getElementById("igText").value = smartTrimStr(out.instagram || "", 2200);
  document.getElementById("fbText").value = smartTrimStr(out.facebook || "", 63206);
  document.getElementById("ytTitleText").value = smartTrimStr(out.ytTitle || "", 95);
  document.getElementById("ytDescText").value = smartTrimStr(out.ytDesc || "", 5000);
  refreshSocialSummary();
}

async function generateFreshDispatchFromBible(cur, existingData) {
  if (!cur.title) {
    writeDispatchFields({ djIntro: "", press: "", x: "", tiktok: "", instagram: "", facebook: "", ytTitle: "", ytDesc: "" });
    return;
  }

  const pat = getPat();
  if (pat) {
    try {
      await fetch("https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/actions/workflows/dahl-dispatch.yml/dispatches", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + pat,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          ref: REPO_BRANCH,
          inputs: {
            track: cur.title,
            artist: cur.artist,
            topic: cur.topic || "fresh single focus",
            nonce: String(NONCE)
          }
        })
      });
    } catch (_) {}
  }

  if (existingData && existingData.dispatch && typeof existingData.dispatch === "object" && existingData.track === cur.title) {
    const d = existingData.dispatch;
    if (d.press && String(d.press).trim().length > 120) {
      writeDispatchFields({
        djIntro: d.djIntro || "",
        press: d.press || "",
        x: d.x || "",
        tiktok: d.tiktok || "",
        instagram: d.instagram || "",
        facebook: d.facebook || "",
        ytTitle: d.ytTitle || "",
        ytDesc: d.ytDesc || ""
      });
      return;
    }
  }

  const linksLine = [cur.portalUrl, cur.appleUrl].filter(Boolean).join(" | ");
  const focusLine = cur.topic ? ("Focus: " + cur.topic + ".") : ("Catalog #" + (cur.id || (cur.idx + 1)) + ".");
  const bibleCount = Object.keys(BIBLE_DOCS).length;
  writeDispatchFields({
    djIntro: cur.title + " by " + cur.artist + " on ANTIPOP (run #" + NONCE + "). " + focusLine,
    press: META.date + "\n\n" + cur.title + " — " + cur.artist + "\n\n" + focusLine + (bibleCount ? ("\n\nbible/ active (" + bibleCount + " docs).") : "") + (linksLine ? ("\nLinks: " + linksLine) : ""),
    x: cur.title + " — " + cur.artist + ". " + focusLine + (linksLine ? (" " + linksLine) : ""),
    tiktok: cur.title + " (" + cur.artist + ") — " + focusLine + (linksLine ? (" " + linksLine) : ""),
    instagram: cur.title + " by " + cur.artist + "\n" + focusLine + (linksLine ? ("\n" + linksLine) : ""),
    facebook: cur.title + " by " + cur.artist + " — " + focusLine + (linksLine ? (" " + linksLine) : ""),
    ytTitle: cur.title + " — " + cur.artist,
    ytDesc: cur.title + " by " + cur.artist + ". " + focusLine + (linksLine ? ("\n" + linksLine) : "")
  });
}

function populateVoices() {
  const sel = document.getElementById("voiceSel");
  const saved = localStorage.getItem("antipop_voice_v1") || "";
  const sysVoices = (window.speechSynthesis && window.speechSynthesis.getVoices) ? window.speechSynthesis.getVoices() : [];
  const seen = new Set();
  const options = [];

  sysVoices.forEach(v => {
    const key = "sys:" + v.name + "|" + v.lang;
    if (!seen.has(key)) {
      seen.add(key);
      options.push({ value: "sys:" + v.name, label: v.name + " (" + v.lang + ")" });
    }
  });
  EDGE_VOICE_CATALOG.forEach(([edgeName, label]) => {
    const key = "edge:" + edgeName;
    if (!seen.has(key)) {
      seen.add(key);
      options.push({ value: "edge:" + edgeName, label: label + " [" + edgeName + "]" });
    }
  });

  sel.innerHTML = "";
  options.forEach(o => {
    const opt = document.createElement("option");
    opt.value = o.value;
    opt.textContent = o.label;
    sel.appendChild(opt);
  });

  if (saved && Array.from(sel.options).some(o => o.value === saved)) {
    sel.value = saved;
  } else if (sel.options.length > 0) {
    sel.selectedIndex = 0;
  }
}

function resolveSpeechProfile(selVal, sysVoices) {
  if (selVal.startsWith("sys:")) {
    const targetName = selVal.slice(4);
    const voice = sysVoices.find(v => v.name === targetName) || null;
    const isMale = /\b(male|man|david|mark|daniel|arthur|george|ryan|steffan|roger|liam|aarav|niwat|keita|henri|conrad|diego)\b/i.test(targetName);
    return {
      voice,
      edgeVoiceName: "",
      lang: (voice && voice.lang) || "en-US",
      pitch: isMale ? 0.88 : 1.06,
      rate: isMale ? 0.96 : 1.0,
      label: voice ? voice.name : targetName
    };
  }

  if (selVal.startsWith("edge:")) {
    const edgeName = selVal.slice(5);
    const catalogEntry = EDGE_VOICE_CATALOG.find(([id]) => id === edgeName);
    const labelText = catalogEntry ? catalogEntry[1] : edgeName;
    const localeMatch = labelText.match(/\(([^)]+)\)/) || edgeName.match(/^([a-z]{2,3}-[A-Z]{2})/);
    const targetLang = localeMatch ? localeMatch[1] : "en-US";
    const langPrefix = targetLang.split("-")[0].toLowerCase();
    const shortName = labelText.split(" ")[0].toLowerCase();
    const isMale = MALE_EDGE_NAMES.has(edgeName);

    const exactLangVoices = sysVoices.filter(v => String(v.lang || "").toLowerCase() === targetLang.toLowerCase());
    const prefixLangVoices = sysVoices.filter(v => String(v.lang || "").toLowerCase().startsWith(langPrefix + "-"));
    const pool = exactLangVoices.length ? exactLangVoices : prefixLangVoices;

    const byName = pool.find(v => String(v.name || "").toLowerCase().includes(shortName));
    const genderRx = isMale
      ? /\b(male|man|david|mark|daniel|arthur|george|ryan|steffan|roger|liam|aarav|niwat|keita|henri|conrad|diego)\b/i
      : /\b(female|woman|aria|luna|jenny|michelle|sonia|natasha|clara|samantha|victoria|zira|premwadee|nanami|sunhi|elvira|denise|katja|isabella|francisca|salma)\b/i;

    const voice =
      byName ||
      pool.find(v => genderRx.test(v.name || "")) ||
      pool[0] ||
      sysVoices.find(v => /^en/i.test(v.lang || "")) ||
      sysVoices[0] ||
      null;

    return {
      voice,
      edgeVoiceName: edgeName,
      lang: targetLang,
      pitch: isMale ? 0.86 : 1.05,
      rate: isMale ? 0.96 : 1.0,
      label: labelText + " [" + edgeName + "]"
    };
  }

  const fallbackVoice = sysVoices.find(v => /^en/i.test(v.lang || "")) || sysVoices[0] || null;
  return {
    voice: fallbackVoice,
    edgeVoiceName: "",
    lang: (fallbackVoice && fallbackVoice.lang) || "en-US",
    pitch: 1.02,
    rate: 0.98,
    label: fallbackVoice ? fallbackVoice.name : "Default"
  };
}

function buildFallbackToneWavBlob(text, pitchFactor) {
  const sampleRate = 22050;
  const seconds = Math.min(4, Math.max(1.2, Math.min(400, String(text || "").length) * 0.025));
  const numSamples = Math.floor(sampleRate * seconds);
  const buffer = new ArrayBuffer(44 + numSamples * 2);
  const view = new DataView(buffer);
  const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };

  writeStr(0, "RIFF");
  view.setUint32(4, 36 + numSamples * 2, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, "data");
  view.setUint32(40, numSamples * 2, true);

  const baseFreq = 220 * (pitchFactor || 1);
  for (let i = 0; i < numSamples; i++) {
    const t = i / sampleRate;
    const env = Math.min(1, t * 12) * Math.min(1, (seconds - t) * 12);
    const sample = Math.sin(2 * Math.PI * baseFreq * t) * 0.22 * env;
    view.setInt16(44 + i * 2, Math.max(-32767, Math.min(32767, Math.floor(sample * 32767))), true);
  }
  return new Blob([buffer], { type: "audio/wav" });
}

function speakText(text) {
  const clean = scrub(text);
  if (!clean) {
    setStatus("Nothing to speak");
    return;
  }
  const selVal = document.getElementById("voiceSel").value || "";
  const sysVoices = (window.speechSynthesis && window.speechSynthesis.getVoices) ? window.speechSynthesis.getVoices() : [];
  const profile = resolveSpeechProfile(selVal, sysVoices);

  if ("speechSynthesis" in window && sysVoices.length > 0) {
    window.speechSynthesis.cancel();
    const chunks = clean.match(/[^.!?]+[.!?]*\s*/g) || [clean];
    chunks.forEach(ch => {
      const part = ch.trim();
      if (!part) return;
      const u = new SpeechSynthesisUtterance(part);
      if (profile.voice) u.voice = profile.voice;
      u.lang = profile.lang;
      u.rate = profile.rate;
      u.pitch = profile.pitch;
      u.onend = () => setStatus("Finished speaking (" + profile.label + ")");
      window.speechSynthesis.speak(u);
    });
    setStatus("Speaking (" + profile.label + ")...");
    return;
  }

  try {
    if (ACTIVE_AUDIO) { ACTIVE_AUDIO.pause(); ACTIVE_AUDIO = null; }
    const wavBlob = buildFallbackToneWavBlob(clean, profile.pitch);
    const url = URL.createObjectURL(wavBlob);
    ACTIVE_AUDIO = new Audio(url);
    ACTIVE_AUDIO.onended = () => { URL.revokeObjectURL(url); setStatus("Audio finished (" + profile.label + ")"); };
    ACTIVE_AUDIO.play().then(() => setStatus("Playing audio cue (" + profile.label + ")")).catch(() => setStatus("Audio ready (" + profile.label + ")"));
  } catch (_) {
    setStatus("Audio playback unavailable in this browser");
  }
}

async function downloadAudioFile(text, baseName) {
  const clean = scrub(text).slice(0, 450);
  if (!clean) {
    setStatus("No text to render audio");
    return;
  }
  const selVal = document.getElementById("voiceSel").value || "";
  const sysVoices = (window.speechSynthesis && window.speechSynthesis.getVoices) ? window.speechSynthesis.getVoices() : [];
  const profile = resolveSpeechProfile(selVal, sysVoices);
  const voiceKey = profile.edgeVoiceName
    ? profile.edgeVoiceName.replace(/Neural$/i, "")
    : (profile.voice && profile.voice.name ? profile.voice.name : "Brian");

  try {
    const resp = await fetch("https://api.streamelements.com/kappa/v2/speech?voice=" + encodeURIComponent(voiceKey) + "&text=" + encodeURIComponent(clean));
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = baseName + ".mp3";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus("Downloaded " + baseName + ".mp3 (" + profile.label + ")");
  } catch (_) {
    const wavBlob = buildFallbackToneWavBlob(clean, profile.pitch);
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = baseName + ".wav";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus("Saved fallback " + baseName + ".wav (" + profile.label + ")");
  }
}

function copyVal(id, label) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.value || "").then(() => setStatus("Copied " + (label || id)));
}

function sendSocialPost(platform, id) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = scrub(el.value || "");
  if (!text) {
    setStatus("Nothing to send for " + platform);
    return;
  }
  if (navigator.share) {
    navigator.share({ text }).then(() => setStatus("Shared " + platform)).catch(() => {
      navigator.clipboard.writeText(text).catch(() => {});
      setStatus("Copied " + platform + " post ready to paste");
    });
  } else {
    navigator.clipboard.writeText(text).catch(() => {});
    setStatus("Copied " + platform + " post ready to send");
  }
}

async function loadCatalogAndDispatch() {
  setStatus("Loading bible/ & catalog...");
  await loadBibleCorpus();

  try {
    const rawCatalog = await fetchRepoFile("strayd/songs-db.json");
    if (rawCatalog) {
      const parsed = JSON.parse(rawCatalog.replace(/^\uFEFF/, ""));
      SONGS = Array.isArray(parsed) ? parsed : (parsed.songs || parsed.tracks || []);
    }
  } catch (_) {}

  const sel = document.getElementById("songSel");
  sel.innerHTML = "";
  if (SONGS.length > 0) {
    SONGS.forEach((s, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = (i + 1) + ". " + scrub(s.title || s.name || ("Track " + (i + 1)));
      sel.appendChild(opt);
    });
    sel.value = "0";
    document.getElementById("catalogStatus").textContent = "ANTIPOP Daily Dispatch (" + SONGS.length + " songs)";
  } else {
    document.getElementById("catalogStatus").textContent = "Catalog unavailable (songs-db.json)";
  }

  let latestData = null;
  try {
    const lr = await fetchRepoFile("strayd/last-dahl-dispatch.json");
    if (lr) latestData = JSON.parse(lr.replace(/^\uFEFF/, ""));
  } catch (_) {}

  const cur = syncSong();
  await generateFreshDispatchFromBible(cur, latestData);
  setStatus("Ready");
}

function wireSocialCards() {
  document.querySelectorAll("#socialCardsGrid .card").forEach(card => {
    const platform = card.dataset.platform || "Post";
    const targetId = card.dataset.target;
    const ta = document.getElementById(targetId);
    if (!ta) return;

    card.addEventListener("click", e => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === "listen") {
        speakText(ta.value);
      } else if (act === "edit") {
        ta.readOnly = false;
        ta.focus();
        setStatus("Editing " + platform);
      } else if (act === "save") {
        ta.readOnly = true;
        ta.value = scrub(ta.value);
        refreshSocialSummary();
        setStatus("Saved " + platform);
      } else if (act === "copy") {
        copyVal(targetId, platform);
      } else if (act === "send") {
        sendSocialPost(platform, targetId);
      }
    });
  });
}

function wireUI() {
  const patEl = document.getElementById("patInput");
  patEl.value = localStorage.getItem("antipop_gh_pat_v1") || "";
  patEl.addEventListener("change", () => localStorage.setItem("antipop_gh_pat_v1", patEl.value.trim()));

  const voiceEl = document.getElementById("voiceSel");
  voiceEl.addEventListener("change", () => {
    localStorage.setItem("antipop_voice_v1", voiceEl.value);
    setStatus("Voice saved");
  });

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      const t = btn.dataset.tab;
      ["dispatch", "studio", "press", "social"].forEach(name => {
        document.getElementById("view-" + name).classList.toggle("hidden", name !== t);
      });
    });
  });

  document.getElementById("songSel").addEventListener("change", async () => {
    NONCE++;
    const cur = syncSong();
    await generateFreshDispatchFromBible(cur, null);
  });
  document.getElementById("topicInput").addEventListener("input", async () => {
    NONCE++;
    const cur = syncSong();
    await generateFreshDispatchFromBible(cur, null);
  });
  document.getElementById("loadBtn").addEventListener("click", () => {
    NONCE++;
    loadCatalogAndDispatch();
  });
  document.getElementById("saveBtn").addEventListener("click", () => {
    localStorage.setItem("antipop_voice_v1", voiceEl.value);
    if (patEl.value.trim()) localStorage.setItem("antipop_gh_pat_v1", patEl.value.trim());
    refreshSocialSummary();
    setStatus("Saved locally");
  });
  document.getElementById("renderBtn").addEventListener("click", async () => {
    NONCE++;
    setStatus("Pulling bible/ & generating fresh dispatch...");
    await loadBibleCorpus();
    const cur = syncSong();
    await generateFreshDispatchFromBible(cur, null);
    await downloadAudioFile(document.getElementById("djIntroText").value, "antipop-dj-intro");
  });
  document.getElementById("stopSpeechBtn").addEventListener("click", () => {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    if (ACTIVE_AUDIO) { ACTIVE_AUDIO.pause(); ACTIVE_AUDIO = null; }
    setStatus("Speech stopped");
  });

  document.getElementById("speakIntroBtn").addEventListener("click", () => speakText(document.getElementById("djIntroText").value));
  document.getElementById("speakPressBtn").addEventListener("click", () => speakText(document.getElementById("pressText").value));
  document.getElementById("dlIntroBtn").addEventListener("click", () => downloadAudioFile(document.getElementById("djIntroText").value, "antipop-dj-intro"));
  document.getElementById("dlPressBtn").addEventListener("click", () => downloadAudioFile(document.getElementById("pressText").value, "antipop-press-release"));
  document.getElementById("copyIntroBtn").addEventListener("click", () => copyVal("djIntroText", "DJ Intro"));
  document.getElementById("copyPressBtn").addEventListener("click", () => copyVal("pressText", "Press Release"));

  wireSocialCards();
}

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = populateVoices;
}
populateVoices();
wireUI();
loadCatalogAndDispatch();
</script>
