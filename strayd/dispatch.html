<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Veg Anna Radio - Dispatch Command</title><style>
:root{--bg:#0b0f17;--card:#131a26;--card2:#192232;--tx:#eef3fb;--mu:#9fb0c8;--ac:#38bdf8;--ok:#4ade80;--bd:rgba(255,255,255,.14)}

.wrap{max-width:1200px;margin:0 auto}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.nav a{color:var(--tx);text-decoration:none;background:var(--card2);padding:6px 11px;border-radius:8px;font-size:.86rem}
.nav a.on,.nav a:hover{background:var(--ac);color:#061018;font-weight:600}
.top{display:grid;grid-template-columns:300px 1fr;gap:20px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;align-items:start}
@media(max-width:820px){.top{grid-template-columns:1fr}.art-box{max-width:320px;margin:0 auto}}
.art-box img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--bd)}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}
label{display:block;font-size:.78rem;color:var(--mu);margin-bottom:4px}
select,input,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-family:inherit}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.dj-ta{min-height:105px;line-height:1.6;padding:12px}
.press-ta{min-height:360px;line-height:1.65;padding:14px}
.soc-ta{min-height:170px;line-height:1.55;padding:12px}
.soc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sleft{display:flex;align-items:center;gap:10px;font-weight:600}
.sleft img{width:42px;height:42px;border-radius:8px;object-fit:cover}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 11px;font-size:.8rem;cursor:pointer}
button.pri{background:var(--ac);color:#061018;border:none;font-weight:600;padding:8px 14px}
button.ok{background:var(--ok);color:#05140b;border:none;font-weight:600;padding:8px 14px}
#st{color:var(--ac);font-size:.85rem}</style></head>
<body><div class="wrap">
<nav class="nav" aria-label="Primary Navigation">

<a href="press.html">Press</a>

</nav>

<div><label for="voiceSel">Voice</label><select id="voiceSel"></select></div>
<div><label for="angleIn">Topic / DJ Angle</label><input id="angleIn" placeholder="Single topic or DJ angle..."/></div>

<button id="pushBibleBtn" type="button">Push Essentials to 000-Bible</button>

</div>
</div>
</section>
<section class="box" aria-label="000-Bible Constitution">
<div class="shead" style="margin-bottom:8px">
<h2 style="margin:0;font-size:1.05rem">bible/000-bible.md Rules</h2>
</div>
<label for="bibleBox">Editable 000-Bible Rules</label>
<textarea id="bibleBox" class="dj-ta" placeholder="Load or edit bible/000-bible.md..."></textarea>
</section>
<section class="box" aria-label="DJ Intro">
<div class="shead" style="margin-bottom:8px">

<button id="cpyDj" type="button">Copy</button>

<button id="cpyPress" type="button">Copy</button>
</div>

<textarea id="pressBox" class="press-ta" placeholder="Single of the day press release..."></textarea>
</section>
<section id="socGrid" class="soc-grid" aria-label="Social Media Posts"></section>
</div>
<script>
const $=id=>document.getElementById(id);
const setVal=(id,v)=>{const el=$(id);if(el)el.value=String(v||"");};
const setTxt=(id,v)=>{const el=$(id);if(el)el.textContent=String(v||"");};
const CH=[["x","X",280],["tiktok","TikTok",2200],["instagram","Instagram",2200],["facebook","Facebook",63206],["ytTitle","YouTube Title",100],["ytDesc","YouTube Description",5000]];
const CITIES="Manila, Melbourne, Ecuador, Atlanta, Santiago, Toronto, Denpasar, Paris, Hat Yai";
const APPLE_URL="https://music.apple.com/us/album/adhd-i-can-do-that-travillen-disorder/1863323315?i=1863323317";
const BUNDLE_URL="https://tinyurl.com/martinstrayd";
const HUB_URL="https://strayd.com";
const YT_URL="https://www.youtube.com/@martinstrayd";
let SONGS=[],VOICES=[],META={date:"",track:"",artist:"",topic:""};

const scrub=s=>String(s||"")
  .replace(/<think>[\s\S]*?<\/think>/gi,"")
  .replace(/^```(?:json)?\s*|\s*```$/gim,"")
  .replace(/\u2014/g,", ")
  .replace(/\u2013/g,"-")
  .replace(/[:\-=*#~]{4,}/g," ")
  .replace(/\s+,/g,",")
  .replace(/[ \t]{2,}/g," ")
  .trim();

function buildCards(){
  const grid=$("socGrid");
  if(!grid)return;
  grid.innerHTML="";
  CH.forEach(([id,lbl,lim])=>{
    const art=document.createElement("article");
    art.className="scard";
    art.setAttribute("aria-label",lbl);
    const head=document.createElement("div");
    head.className="shead";
    const left=document.createElement("div");
    left.className="sleft";
    const img=document.createElement("img");
    img.setAttribute("data-th","");
    img.alt=lbl+" cover art";
    const h2=document.createElement("h2");
    h2.style.margin="0";
    h2.style.fontSize="1rem";
    h2.textContent=lbl;
    left.appendChild(img);
    left.appendChild(h2);
    const cnt=document.createElement("span");
    cnt.id="c_"+id;
    cnt.style.color="var(--mu)";
    cnt.style.fontSize=".8rem";
    cnt.textContent="0 / "+lim;
    head.appendChild(left);
    head.appendChild(cnt);
    const lab=document.createElement("label");
    lab.htmlFor="t_"+id;
    lab.textContent=lbl+" Post";
    const ta=document.createElement("textarea");
    ta.id="t_"+id;
    ta.className="soc-ta";
    ta.maxLength=lim;
    ta.addEventListener("input",()=>{cnt.textContent=ta.value.length+" / "+lim;});
    const bar=document.createElement("div");
    bar.className="bar";
    const bSpk=document.createElement("button");
    bSpk.type="button";
    bSpk.textContent="Speak";
    bSpk.onclick=()=>speakTxt(ta.value,false);
    const bDl=document.createElement("button");
    bDl.type="button";
    bDl.textContent="Download Audio";
    bDl.onclick=()=>dlAudio(ta.value,id+"-anna");
    const bCpy=document.createElement("button");
    bCpy.type="button";
    bCpy.textContent="Copy";
    bCpy.onclick=()=>cpyTxt(ta.value,lbl);
    bar.appendChild(bSpk);bar.appendChild(bDl);bar.appendChild(bCpy);
    art.appendChild(head);art.appendChild(lab);art.appendChild(ta);art.appendChild(bar);
    grid.appendChild(art);
  });
}

function getPat(){
  const p=(($("patIn")&&$("patIn").value)||"").trim()||localStorage.getItem("anna_dispatch_pat")||"";
  if(p)localStorage.setItem("anna_dispatch_pat",p);
  return p;
}

function b64ToUtf8(b64){
  const bin=atob(String(b64||"").replace(/\s+/g,""));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function utf8ToB64(str){
  const bytes=new TextEncoder().encode(String(str||""));
  let bin="";
  for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}

async function fetchRepo(p){
  const pat=getPat();
  if(pat){
    try{
      const r=await fetch("https://api.github.com/repos/agent-anna/home/contents/"+p+"?ref=main",{
        headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github.v3+json"},cache:"no-store"
      });
      if(r.ok){const j=await r.json();if(j&&j.content)return b64ToUtf8(j.content);}
    }catch{}
  }
  for(const b of["https://agent-anna.github.io/home/","https://raw.githubusercontent.com/agent-anna/home/main/"]){
    try{const r=await fetch(b+p+"?t="+Date.now(),{cache:"no-store"});if(r.ok)return await r.text();}catch{}
  }
  return"";
}

async function putRepo(p,content,msg){
  const pat=getPat();
  if(!pat)throw new Error("Enter GitHub PAT first");
  const api="https://api.github.com/repos/agent-anna/home/contents/"+p;
  const g=await fetch(api+"?ref=main",{headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github.v3+json"},cache:"no-store"});
  if(!g.ok)throw new Error("GET HTTP "+g.status);
  const gj=await g.json();
  const put=await fetch(api,{
    method:"PUT",
    headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},
    body:JSON.stringify({message:msg,content:utf8ToB64(content),sha:gj.sha,branch:"main"})
  });
  if(!put.ok)throw new Error("PUT HTTP "+put.status);
  return await put.json();
}

function artUrl(s,t){
  const r=String((s&&(s.artUrl||s.art||s.image||s.artwork))||"").trim();
  if(!r)return"https://martinstrayd.github.io/artist/store-art/Martin%20Strayd%20-%20"+encodeURIComponent(t)+".png";
  if(/^https?:\/\//i.test(r))return r;
  return"https://martinstrayd.github.io/artist/"+encodeURI(r.replace(/^\.?\//,""));
}

function syncSong(){
  const idx=$("songSel")?Number($("songSel").value||0):0;
  const s=SONGS[idx]||{title:"Adhd I Can Do That (Travillen Disorder)",artist:"Martin Strayd"};
  const t=scrub(s.title||s.name||"Adhd I Can Do That (Travillen Disorder)");
  const a=scrub(s.artist||"Martin Strayd");
  const topic=scrub(($("angleIn")&&$("angleIn").value)||s.topic||s.theme||s.genre||"single drop and neurodivergent focus");
  const u=artUrl(s,t);
  setTxt("songTitle",t);
  setTxt("songMeta",a+" - "+SONGS.length+" songs - Veg Anna Radio Dispatch");
  if($("bigArt"))$("bigArt").src=u;
  document.querySelectorAll("img[data-th]").forEach(im=>{im.src=u;});
  META.track=t;META.artist=a;META.topic=topic;
  return{idx,t,a,topic};
}

function buildDefaults(t,a,topic,dt){
  const dStr=dt||new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  const press=[
    "FOR IMMEDIATE RELEASE - "+dStr,
    "Single of the Day on Veg Anna Radio: "+t+" by "+a,
    "",
    "Single Release and World Radio Cities: "+a+" launches "+t+" as today's single and licensed original music drop on Veg Anna Radio, with world radio stations playing his music across "+CITIES+".",
    "",
    "About Martin Strayd: "+a+" is an Australian lyricist, songwriter, and composer, and a former guitar technician for rock acts including Steve Jones of the Sex Pistols and Doug Fieger of The Knack.",
    "",
    "Ownership and Links: Buyers who get MP3 and cover art bundles own them directly and can share freely with friends for non-commercial play; commercial resale is prohibited. Hub: "+HUB_URL+" | Bundle: "+BUNDLE_URL+" | Apple Music: "+APPLE_URL+" | YouTube: "+YT_URL
  ].join("\n");
  return{
    djIntro:scrub("You are locked into Veg Anna Radio with today's single from "+a+": "+t+", focused on "+topic+"."),
    press:scrub(press),
    x:scrub("Veg Anna Radio spin: "+t+" by "+a+" locks into "+topic+". Hear it: "+APPLE_URL+" #martinstrayd").slice(0,275),
    tiktok:scrub(t+" by "+a+" ("+topic+") on Veg Anna Radio. Grab MP3 + art at "+BUNDLE_URL+" and share freely with friends for non-commercial play #martinstrayd #veganaradio #dailysingle").slice(0,2200),
    instagram:scrub("Today's single on Veg Anna Radio is "+t+" by "+a+", exploring "+topic+". Direct MP3 and cover art bundle at "+BUNDLE_URL+" with free non-commercial friend sharing. #martinstrayd #veganaradio #newrelease").slice(0,2200),
    facebook:scrub("Veg Anna Radio daily single spotlight: "+t+" by "+a+", diving into "+topic+". World radio cities playing his music include "+CITIES+". Full hub at "+HUB_URL+" #martinstrayd #veganaradio").slice(0,63206),
    ytTitle:scrub(t+" - "+a+" | Veg Anna Radio").slice(0,95),
    ytDesc:scrub(t+" by "+a+" on Veg Anna Radio. Topic: "+topic+". Apple Music: "+APPLE_URL+" | Bundle (free non-commercial sharing with friends, no resale): "+BUNDLE_URL+" | Hub: "+HUB_URL+" #martinstrayd #veganaradio").slice(0,5000)
  };
}

function applyDispatch(data){
  const cur=syncSong();
  const fb=buildDefaults(cur.t,cur.a,cur.topic,(data&&data.date)||"");
  const d=(data&&typeof data.dispatch==="object"&&data.dispatch)?data.dispatch:{};
  META.date=scrub((data&&data.date)||"");
  const out={
    djIntro:scrub(d.djIntro||fb.djIntro),
    press:scrub(d.press||fb.press),
    x:scrub(d.x||fb.x).slice(0,280),
    tiktok:scrub(d.tiktok||fb.tiktok).slice(0,2200),
    instagram:scrub(d.instagram||fb.instagram).slice(0,2200),
    facebook:scrub(d.facebook||fb.facebook).slice(0,63206),
    ytTitle:scrub(d.ytTitle||fb.ytTitle).slice(0,100),
    ytDesc:scrub(d.ytDesc||fb.ytDesc).slice(0,5000)
  };
  setVal("djBox",out.djIntro);
  setVal("pressBox",out.press);
  CH.forEach(([id,,lim])=>{
    const v=String(out[id]||"").slice(0,lim);
    setVal("t_"+id,v);
    setTxt("c_"+id,v.length+" / "+lim);
  });
}

async function loadBible(){
  setTxt("st","Reading bible/000-bible.md...");
  const raw=await fetchRepo("bible/000-bible.md");
  setVal("bibleBox",scrub(raw));
  setTxt("st",raw?"Loaded bible/000-bible.md":"bible/000-bible.md not found");
}

async function pushBible(){
  try{
    const txt=scrub($("bibleBox")&&$("bibleBox").value||"");
    if(!txt)throw new Error("000-bible text is empty");
    const res=await putRepo("bible/000-bible.md",txt,"chore(bible): update 000-bible.md from dispatch console");
    setTxt("st","Pushed 000-bible.md -> "+(res.commit&&res.commit.sha?res.commit.sha.slice(0,7):"ok"));
  }catch(e){setTxt("st","Bible push failed: "+e.message);}
}

async function loadLatest(){
  setTxt("st","Loading dispatch...");
  const raw=await fetchRepo("strayd/last-dahl-dispatch.json");
  if(!raw){applyDispatch({});setTxt("st","Ready with fresh dispatch");return;}
  try{
    const j=JSON.parse(raw);
    if(j&&j.track&&$("songSel")){
      const i=SONGS.findIndex(x=>scrub(x.title||x.name).toLowerCase()===scrub(j.track).toLowerCase());
      if(i>=0)$("songSel").value=String(i);
    }
    applyDispatch(j);
    setTxt("st","Loaded "+((j&&j.track)||"dispatch"));
  }catch(e){applyDispatch({});setTxt("st","Recovered: "+e.message);}
}

async function saveDispatch(){
  try{
    const cur=syncSong();
    const payload={
      date:META.date||new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}),
      track:cur.t,artist:cur.a,topic:cur.topic,api_status:"saved_from_dispatch_ui",
      dispatch:{
        djIntro:scrub($("djBox")&&$("djBox").value||""),
        press:scrub($("pressBox")&&$("pressBox").value||""),
        x:scrub($("t_x")&&$("t_x").value||"").slice(0,280),
        tiktok:scrub($("t_tiktok")&&$("t_tiktok").value||"").slice(0,2200),
        instagram:scrub($("t_instagram")&&$("t_instagram").value||"").slice(0,2200),
        facebook:scrub($("t_facebook")&&$("t_facebook").value||"").slice(0,63206),
        ytTitle:scrub($("t_ytTitle")&&$("t_ytTitle").value||"").slice(0,100),
        ytDesc:scrub($("t_ytDesc")&&$("t_ytDesc").value||"").slice(0,5000)
      }
    };
    const res=await putRepo("strayd/last-dahl-dispatch.json",JSON.stringify(payload,null,2),"edit(dispatch): save dispatch from dispatch.html");
    setTxt("st","Saved dispatch -> "+(res.commit&&res.commit.sha?res.commit.sha.slice(0,7):"ok"));
  }catch(e){setTxt("st","Save failed: "+e.message);}
}

async function loadSongs(){
  const raw=await fetchRepo("strayd/songs-db.json");
  try{const d=JSON.parse(raw);SONGS=Array.isArray(d)?d:(d.songs||d.tracks||[]);}catch{}
  if(!SONGS.length)SONGS=[{title:"Adhd I Can Do That (Travillen Disorder)",artist:"Martin Strayd",topic:"neurodivergent drive and high-speed focus"}];
  const sel=$("songSel");
  if(sel){
    sel.innerHTML="";
    SONGS.forEach((x,i)=>{const o=document.createElement("option");o.value=i;o.textContent=(i+1)+" - "+(x.title||x.name||"Track");sel.appendChild(o);});
  }
  syncSong();
}

async function triggerAction(){
  const pat=getPat();
  if(!pat){setTxt("st","Paste GitHub PAT first to trigger Dahl workflow");return;}
  const{idx,topic}=syncSong();
  try{
    const r=await fetch("https://api.github.com/repos/agent-anna/home/actions/workflows/dahl-dispatch.yml/dispatches",{
      method:"POST",
      headers:{Authorization:"Bearer "+pat,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},
      body:JSON.stringify({ref:"main",inputs:{song_index:String(idx),angle:(($("angleIn")&&$("angleIn").value.trim())||topic)}})
    });
    if(!r.ok)throw new Error("HTTP "+r.status);
    setTxt("st","Triggered Dahl Action for song_index="+idx);
  }catch(e){setTxt("st","Action failed: "+e.message);}
}

function getSelectedVoice(){
  const sel=$("voiceSel");
  const list=("speechSynthesis"in window)?(speechSynthesis.getVoices()||[]):[];
  if(!sel)return list[0]||VOICES[0]||null;
  const opt=sel.options[sel.selectedIndex];
  const wn=opt?opt.dataset.vname:"";const wl=opt?opt.dataset.vlang:"";
  if(wn){const m=list.find(v=>v.name===wn&&(!wl||v.lang===wl));if(m)return m;}
  return list[Number(sel.value||0)]||VOICES[Number(sel.value||0)]||list[0]||null;
}

function popV(){
  if(!("speechSynthesis"in window))return;
  const list=speechSynthesis.getVoices()||[];
  if(!list.length)return;
  const prev=getSelectedVoice();
  VOICES=list.slice();
  const sel=$("voiceSel");
  if(!sel)return;
  sel.innerHTML="";
  VOICES.forEach((v,i)=>{
    const o=document.createElement("option");
    o.value=String(i);o.dataset.vname=v.name;o.dataset.vlang=v.lang;
    o.textContent=v.name+" ("+v.lang+")";
    if(prev&&v.name===prev.name&&v.lang===prev.lang)o.selected=true;
    sel.appendChild(o);
  });
}

function cleanSpeech(t){return scrub(String(t||"")).replace(/https?:\/\/\S+/g," ").replace(/#[A-Za-z0-9_]+/g," ").replace(/\s+/g," ").trim();}

function speakTxt(t,announceOnly){
  if(!("speechSynthesis"in window))return;
  const sp=announceOnly?String(t||"").trim():cleanSpeech(t).slice(0,1500);
  if(!sp)return;
  if(!VOICES.length)popV();
  try{speechSynthesis.cancel();}catch{}
  const voice=getSelectedVoice();
  const parts=announceOnly?[sp]:(sp.match(/[^.!?]+[.!?]?/g)||[sp]).slice(0,12);
  parts.forEach(pt=>{
    const c=pt.trim();if(!c)return;
    const u=new SpeechSynthesisUtterance(c);
    if(voice){u.voice=voice;if(voice.lang)u.lang=voice.lang;}
    speechSynthesis.speak(u);
  });
}

function makeWav(text){
  const sr=16000,dur=Math.min(10,Math.max(1.5,cleanSpeech(text).split(/\s+/).length/6)),n=Math.floor(sr*dur);
  const buf=new ArrayBuffer(44+n*2),view=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");view.setUint32(4,36+n*2,true);ws(8,"WAVE");ws(12,"fmt ");view.setUint32(16,16,true);
  view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,sr,true);view.setUint32(28,sr*2,true);
  view.setUint16(32,2,true);view.setUint16(34,16,true);ws(36,"data");view.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    const env=Math.min(1,i/(sr*0.05))*Math.min(1,(n-i)/(sr*0.05));
    const s16=Math.max(-32768,Math.min(32767,Math.floor(Math.sin(2*Math.PI*220*(i/sr))*0.06*env*32767)));
    view.setInt16(44+i*2,s16,true);
  }
  return new Blob([buf],{type:"audio/wav"});
}

async function dlAudio(t,base){
  const sp=cleanSpeech(t).slice(0,400);
  if(!sp){setTxt("st","Nothing to save");return;}
  speakTxt(sp,false);
  const v=getSelectedVoice();
  const vn=v&&/amy|emma|aria|jenny|sonia|samantha|victoria|zira/i.test(v.name)?v.name.split(" ")[0]:"Amy";
  try{
    const r=await fetch("https://api.streamelements.com/kappa/v2/speech?voice="+encodeURIComponent(vn)+"&text="+encodeURIComponent(sp));
    if(!r.ok)throw new Error("HTTP "+r.status);
    const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement("a");
    a.href=u;a.download=base+".mp3";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);setTxt("st","Downloaded "+base+".mp3");
  }catch{
    const w=makeWav(sp);const u=URL.createObjectURL(w);const a=document.createElement("a");
    a.href=u;a.download=base+".wav";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);setTxt("st","Saved "+base+".wav");
  }
}

function cpyTxt(t,lbl){navigator.clipboard?.writeText(String(t||""));setTxt("st","Copied "+lbl);}
