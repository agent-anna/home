name: Agent Anna Dahl Dispatch
on:
  workflow_dispatch:
    inputs:
      song_index:
        description: "0-based track index in strayd/songs-db.json"
        required: false
        default: "0"
      angle:
        description: "Optional hook or story angle"
        required: false
        default: ""
      voice:
        description: "Edge TTS voice for MP3 export"
        required: false
        default: "en-US-JennyNeural"
      mode:
        description: "full or render_mp3_only"
        required: false
        default: "full"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install edge-tts for real MP3 generation
        run: pip install -q edge-tts
      - name: Run Dahl generator and synthesize real MP3 files in selected voice
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_KEY }}
          SONG_INDEX: ${{ github.event.inputs.song_index || '0' }}
          ANGLE: ${{ github.event.inputs.angle || '' }}
          TTS_VOICE: ${{ github.event.inputs.voice || 'en-US-JennyNeural' }}
          RUN_MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          python3 - << 'PY'
          import asyncio, datetime, hashlib, json, os, pathlib, re, urllib.request
          import edge_tts

          key = (os.environ.get("DAHL_API_KEY") or "").strip()
          try:
              idx = int((os.environ.get("SONG_INDEX") or "0").strip() or "0")
          except Exception:
              idx = 0
          angle = (os.environ.get("ANGLE") or "").strip()
          tts_voice = (os.environ.get("TTS_VOICE") or "en-US-JennyNeural").strip()
          if not re.match(r"^[a-z]{2}-[A-Z]{2}-[A-Za-z0-9]+Neural$", tts_voice):
              tts_voice = "en-US-JennyNeural"
          run_mode = (os.environ.get("RUN_MODE") or "full").strip().lower()
          today = datetime.date.today().strftime("%B %d, %Y")

          def scrub(s):
              s = str(s or "")
              s = re.sub(r"<think>[\s\S]*?</think>", "", s, flags=re.I).strip()
              s = s.replace("\u2014", ", ").replace("\u2013", "-")
              s = re.sub(r"[:\-=*#~]{4,}", " ", s)
              s = re.sub(r"\s+,", ",", s)
              return re.sub(r"[ \t]{2,}", " ", s).strip()

          def cap_tags(txt, max_tags):
              tags = re.findall(r"#[A-Za-z0-9_]+", txt)
              if len(tags) <= max_tags:
                  return txt
              seen = 0
              def repl(m):
                  nonlocal seen
                  seen += 1
                  return m.group(0) if seen <= max_tags else ""
              out = re.sub(r"#[A-Za-z0-9_]+", repl, txt)
              return re.sub(r"[ \t]{2,}", " ", out).strip()

          def clean_for_tts(t):
              t = scrub(t)
              t = re.sub(r"https?://\S+", " ", t)
              t = re.sub(r"#[A-Za-z0-9_]+", " ", t)
              return re.sub(r"\s+", " ", t).strip()

          out_path = pathlib.Path("strayd/last-dahl-dispatch.json")
          existing = {}
          if out_path.exists():
              try:
                  existing = json.loads(out_path.read_text(encoding="utf-8", errors="ignore"))
              except Exception:
                  existing = {}

          if run_mode == "render_mp3_only" and isinstance(existing.get("dispatch"), dict) and existing["dispatch"]:
              payload = existing
              final_d = {k: scrub(v) for k, v in existing["dispatch"].items()}
              api_status = existing.get("api_status") or "rendered_selected_voice"
          else:
              b000 = pathlib.Path("bible/000-bible.md").read_text(encoding="utf-8", errors="ignore")[:4200] if pathlib.Path("bible/000-bible.md").exists() else ""
              prof = pathlib.Path("bible/resources/artist-and-radio-profile.md").read_text(encoding="utf-8", errors="ignore")[:1600] if pathlib.Path("bible/resources/artist-and-radio-profile.md").exists() else ""
              play = pathlib.Path("bible/resources/platform-playbooks.md").read_text(encoding="utf-8", errors="ignore")[:1000] if pathlib.Path("bible/resources/platform-playbooks.md").exists() else ""

              songs_path = pathlib.Path("strayd/songs-db.json")
              songs = []
              if songs_path.exists():
                  try:
                      raw = json.loads(songs_path.read_text(encoding="utf-8", errors="ignore"))
                      songs = raw if isinstance(raw, list) else (raw.get("songs") or raw.get("tracks") or [])
                  except Exception:
                      songs = []
              track = songs[idx] if songs and 0 <= idx < len(songs) else {"title": "Adhd I Can Do That (Travillen Disorder)", "artist": "Martin Strayd"}
              title = scrub(track.get("title") or track.get("name") or "Adhd I Can Do That (Travillen Disorder)")
              artist = scrub(track.get("artist") or "Martin Strayd")
              topic = scrub(track.get("topic") or track.get("theme") or track.get("mood") or track.get("genre") or angle or "unstoppable creative overdrive and modern life")

              seed_src = f"{today}|{idx}|{title}|{topic}|{angle}|{os.environ.get('GITHUB_RUN_ID','')}"
              variant = int(hashlib.sha256(seed_src.encode("utf-8")).hexdigest(), 16) % 4

              sys_msg = (
                  "Return ONLY valid JSON with keys: djIntro, press, x, tiktok, instagram, facebook, ytTitle, ytDesc.\n"
                  "Obey bible/000-bible.md strictly: ANNA is the broadcaster, ANTIPOP is the station, Veg Anna is the radio DJ and main host, Martin Strayd is the signal, the catalog is the empire.\n"
                  "Zero em-dashes or en-dashes (no U+2014 or U+2013), zero repeated symbol runs, keep single title intact.\n"
                  "press: Full 3/4-page press release (6 paragraphs, 380+ words) for ANTIPOP hosted by Veg Anna and broadcast by ANNA, covering today's single, daily singles campaign across 100+ songs, all 10 world radio countries, Martin Strayd's history, MP3/art ownership (free non-commercial friend sharing; commercial resale prohibited), and CTA + links.\n"
                  "Socials: ZERO repeated sentences or template lines across platforms.\n"
                  + b000 + "\n" + prof + "\n" + play
              )
              usr_msg = f"Date: {today}\nVariant: {variant}\nSingle of the Day: {title}\nArtist: {artist}\nTopic: {topic}"

              raw_txt = ""
              api_status = "fallback_ready"
              if key:
                  try:
                      req = urllib.request.Request(
                          "https://inference.dahl.global/v1/chat/completions",
                          data=json.dumps({
                              "model": "MiniMaxAI/MiniMax-M2.7",
                              "max_tokens": 2000,
                              "messages": [{"role": "system", "content": sys_msg}, {"role": "user", "content": usr_msg}]
                          }).encode("utf-8"),
                          headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json", "User-Agent": "Agent-Anna-GH"},
                          method="POST"
                      )
                      with urllib.request.urlopen(req, timeout=40) as resp:
                          body = json.loads(resp.read().decode("utf-8"))
                          choices = body.get("choices") or []
                          if choices:
                              raw_txt = ((choices[0].get("message") or {}).get("content") or "")
                              api_status = f"http_{resp.status}"
                  except Exception as e:
                      api_status = f"fast_fallback_{type(e).__name__}"

              no_think = re.sub(r"<think>[\s\S]*?</think>", "", raw_txt, flags=re.I).strip()
              fenced = re.sub(r"^```(?:json)?\s*|\s*```$", "", no_think, flags=re.I).strip()
              parsed = {}
              m = re.search(r"\{[\s\S]*\}", fenced)
              if m:
                  try:
                      obj = json.loads(m.group(0), strict=False)
                      if isinstance(obj, dict):
                          parsed = {k: scrub(v) for k, v in obj.items()}
                  except Exception:
                      parsed = {}

              countries = "Philippines, Australia, Ecuador, United States, Chile, Canada, Indonesia, France, Thailand, and United Kingdom"
              apple_url = "https://music.apple.com/us/album/adhd-i-can-do-that-travillen-disorder/1863323315?i=1863323317"
              bundle_url = "https://tinyurl.com/martinstrayd"
              hub_url = "https://strayd.com"
              yt_url = "https://www.youtube.com/@martinstrayd"

              dj_bank = [
                  f"Good evening, music lovers! You are locked into ANTIPOP, broadcast by ANNA, and I am your host Veg Anna! Somewhere on Earth right now, someone is hearing '{title}' by {artist} for the very first time, diving straight into {topic}. Let's turn it up and feel the world listen!",
                  f"Hey everybody, it is Veg Anna hosting live on ANTIPOP, broadcast by ANNA! Today's brand-new single premiere is '{title}' from {artist}, built around {topic}. Across ten countries and more than a hundred original tracks, the daily song revolution rolls on!",
                  f"Welcome back to ANTIPOP, where ANNA broadcasts a brand-new single to the world every single day! I am Veg Anna, and today we spotlight '{title}' by {artist}, a high-voltage look at {topic}. Let's spin today's feature single!",
                  f"From Hollywood guitar tech to global daily single creator, {artist} is back on ANTIPOP with your host Veg Anna! Today's feature release is '{title}', capturing {topic} for listeners around the globe. Here we go!"
              ]

              x_bank = [
                  f"Major labels release once a quarter. {artist} drops a new single every single day on ANTIPOP. Hear '{title}' ({topic}): {apple_url} #martinstrayd",
                  f"The track nobody expected {artist} to drop today just hit ANTIPOP: '{title}', tackling {topic}. Listen now: {apple_url} #martinstrayd",
                  f"Backstage for the Sex Pistols and The Knack, now building an independent song-a-day empire. Hear {artist} on '{title}': {apple_url} #martinstrayd",
                  f"One artist. One song a day. Zero label gatekeepers. Stream '{title}' by {artist} ({topic}) on ANTIPOP: {apple_url} #martinstrayd"
              ]

              tt_bank = [
                  f"POV: You found the one song that sounds like {topic} running at 200 mph. '{title}' by {artist} is today's daily single drop on ANTIPOP with host Veg Anna, built for late-night drives and creator edits. Full audio and art bundle: {bundle_url} #martinstrayd #newmusic #dailysingle #fyp #songrecommendation",
                  f"Wait for the hook on '{title}' by {artist}. If your brain lives inside {topic}, this daily single from the 100+ song ANTIPOP catalog will hit home immediately. Grab the bundle at {bundle_url} #martinstrayd #antipop #indiemusic #musicdiscovery #newrelease",
                  f"How a former Hollywood guitar tech for rock legends started dropping one original song every single day: meet '{title}' by {artist}, exploring {topic}. Hear it and get the bundle at {bundle_url} #martinstrayd #rockhistory #songaday #musicstory #artist",
                  f"Stop scrolling if you love raw, story-driven tracks about {topic}. '{title}' by {artist} just landed as today's Single of the Day on ANTIPOP. Bundle link: {bundle_url} #martinstrayd #dailydrop #music #playlist #discover"
              ]

              ig_bank = [
                  f"Some songs feel like a midnight confession you did not know you needed. With '{title}', {artist} turns {topic} into a vivid, unfiltered chapter of his 100+ song independent catalog on ANTIPOP. Listeners who collect the direct MP3 and cover art bundle at {bundle_url} own it outright and can share it freely with friends for non-commercial listening. #martinstrayd #antipop #storytelling #independentartist #dailysingle",
                  f"Every song in the {artist} universe carries a pulse of real life, rebellion, and late-night honesty. Today's feature release '{title}' steps straight into {topic}, proving what happens when an artist owns every note from studio to listener. Direct MP3 and cover art ownership available at {bundle_url} (free non-commercial sharing with friends welcome). #martinstrayd #musicjourney #originalmusic #newrelease #songwriting",
                  f"Behind '{title}' is a simple truth about {topic} that hits harder the second time you play it. Hosted today by Veg Anna on ANTIPOP, {artist} continues his daily single odyssey with direct-to-fan MP3 and artwork bundles at {bundle_url}, ready to share non-commercially with friends. #martinstrayd #songmeaning #indierock #musiclovers #catalog",
                  f"No middlemen, no waiting rooms, just pure songcraft delivered one day at a time. '{title}' captures {artist} reflecting on {topic} with raw emotional weight. Own the MP3 and cover art bundle directly at {bundle_url} and pass it along to friends for non-commercial play. #martinstrayd #artistowned #dailyrelease #musiccommunity #soundtrack"
              ]

              fb_bank = [
                  f"Listeners tuning in from {countries} are discovering today's Single of the Day on ANTIPOP (hosted by Veg Anna and broadcast by ANNA): '{title}' by {artist}. What started as a bold song-a-day experiment has grown into a 100+ track independent catalog connecting radio audiences across ten nations. Explore the full catalog, stories, and direct artist hub at {hub_url} #martinstrayd #antipop #worldradio #independentmusic #dailysingle",
                  f"Across {countries}, world radio stations are spinning the catalog of {artist}, and today's spotlight lands on '{title}'. Drawing on years backstage as a Hollywood celebrity guitar technician before launching his own independent media network, {artist} invites listeners inside the music at {hub_url} #martinstrayd #rockandroll #globalradio #musiccommunity #newmusic",
                  f"Imagine a station where a brand-new studio single premieres every single day for listeners across {countries}. That is the heartbeat of ANTIPOP with host Veg Anna and {artist}, featured today with '{title}' ({topic}). Join the listener community and explore the archive at {hub_url} #martinstrayd #radio #musicdiscovery #songaday #artist",
                  f"From {countries} to your speakers right now: '{title}' marks the latest chapter in {artist}'s daily singles launch campaign on ANTIPOP. Discover how one independent artist built a self-owned catalog of over 100 songs at {hub_url} #martinstrayd #antipop #musicfans #catalog #globalmusic"
              ]

              yt_titles = [
                  f"Inside '{title}' by {artist} | Story, Sound & ANTIPOP Daily Single",
                  f"{artist} - '{title}' (How a Former Rock Guitar Tech Built a Song-a-Day Empire)",
                  f"Why '{title}' Hits Different | {artist} Daily Single on ANTIPOP",
                  f"'{title}' by {artist} | Official ANTIPOP Daily Release & Catalog Story"
              ]

              base_press = (
                  f"FOR IMMEDIATE RELEASE - {today}\n"
                  f"ANTIPOP PREMIERES '{title}' BY {artist.upper()} AS TODAY'S SINGLE OF THE DAY\n\n"
                  f"GLOBAL DAILY SINGLES LAUNCH CAMPAIGN: Broadcast by ANNA and hosted by Veg Anna, station ANTIPOP today officially premieres '{title}' by {artist} as its featured Single of the Day. The release anchors an ongoing daily singles launch campaign built around one artist, one new song per day, and continuous global discovery across an expanding catalog of more than 100 original studio recordings and licensed tracks.\n\n"
                  f"ABOUT THE SINGLE AND SONG STORY: Centered on {topic}, '{title}' blends story-driven songwriting, sharp observation, and radio-ready production. Rather than treating music as a disposable one-day upload, ANTIPOP pairs each daily single with dedicated Veg Anna radio intros, cover artwork, and searchable catalog documentation so listeners and music programmers worldwide can explore the narrative behind every release.\n\n"
                  f"WORLD RADIO BROADCAST FOOTPRINT: {artist}'s catalog enjoys active world radio airplay reaching audiences across 10 countries: {countries}. Through continuous radio rotation and daily single premieres, international listeners experience each new release as part of a connected, living broadcast schedule.\n\n"
                  f"ABOUT {artist.upper()}: {artist} is an Australian lyricist, songwriter, and composer, and a former Hollywood celebrity guitar technician who worked backstage for rock legends including Steve Jones of the Sex Pistols and Doug Fieger of The Knack before channeling his personal experiences into his own recording career. Operating independently without traditional major-label gatekeepers, his sprawling catalog spans radio rock, anti-pop, reggae, blues, and electronic dance floor remixes exploring modern life, freedom, rebellion, and love.\n\n"
                  f"DIRECT FAN OWNERSHIP AND NON-COMMERCIAL SHARING MODEL: Under the self-built artist-under-one-roof business model, listeners who purchase MP3 and cover art bundles own their files directly and are explicitly authorized to copy and share them freely with friends for non-commercial listening. Commercial resale, redistribution for profit, or unauthorized monetization of the audio files or artwork is strictly prohibited.\n\n"
                  f"MEDIA AND LISTENER CALL TO ACTION: Tune in to ANTIPOP with host Veg Anna to hear '{title}' in rotation, explore the 100+ song catalog, and support independent artist-owned music directly through the official links below:\n"
                  f"Official Artist Portfolio and Hub: {hub_url}\n"
                  f"Direct MP3 and Cover Art Bundle: {bundle_url}\n"
                  f"Stream on Apple Music: {apple_url}\n"
                  f"Official YouTube Channel: {yt_url}"
              )

              press_val = scrub(parsed.get("press") or "")
              if len(press_val) < 1200:
                  press_val = scrub(base_press)

              yt_desc_default = (
                  f"{title} by {artist} | Featured Single of the Day on ANTIPOP (Hosted by Veg Anna, Broadcast by ANNA).\n"
                  f"Theme & Story: {topic}. Discover {artist}, Australian lyricist, songwriter, composer, and former Hollywood celebrity guitar technician (Steve Jones of the Sex Pistols, Doug Fieger of The Knack), building a 100+ song independent daily singles catalog heard across {countries}.\n"
                  f"Stream on Apple Music: {apple_url}\n"
                  f"Direct MP3 & Cover Art Bundle (Own your copy and share freely with friends for non-commercial listening; commercial resale prohibited): {bundle_url}\n"
                  f"Official Artist Hub: {hub_url}\n"
                  f"#martinstrayd #antipop #dailysingle #independentmusic #newmusic"
              )

              final_d = {
                  "djIntro": scrub(parsed.get("djIntro") or dj_bank[variant]),
                  "press": press_val,
                  "x": cap_tags(scrub(parsed.get("x") or x_bank[variant]), 2)[:275],
                  "tiktok": cap_tags(scrub(parsed.get("tiktok") or tt_bank[variant]), 5)[:2200],
                  "instagram": cap_tags(scrub(parsed.get("instagram") or ig_bank[variant]), 5)[:2200],
                  "facebook": cap_tags(scrub(parsed.get("facebook") or fb_bank[variant]), 5)[:63206],
                  "ytTitle": scrub(re.sub(r"#[A-Za-z0-9_]+", "", parsed.get("ytTitle") or yt_titles[variant]))[:95],
                  "ytDesc": cap_tags(scrub(parsed.get("ytDesc") or yt_desc_default), 5)[:5000],
              }
              payload = {
                  "date": today,
                  "track": title,
                  "artist": artist,
                  "topic": topic,
                  "variant": variant,
                  "api_status": api_status,
                  "dispatch": final_d,
                  "clean_text": scrub(fenced)
              }

          audio_dir = pathlib.Path("strayd/audio")
          audio_dir.mkdir(parents=True, exist_ok=True)
          audio_urls = {}

          async def render_all_mp3():
              for k, txt in final_d.items():
                  spoken = clean_for_tts(txt)[:2500]
                  if not spoken:
                      continue
                  mp3_file = audio_dir / f"{k}.mp3"
                  comm = edge_tts.Communicate(spoken, tts_voice)
                  await comm.save(str(mp3_file))
                  audio_urls[k] = f"strayd/audio/{k}.mp3"

          asyncio.run(render_all_mp3())
          payload["voice"] = tts_voice
          payload["audio"] = audio_urls
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")
          print("Wrote", out_path, "voice:", tts_voice, "MP3 count:", len(audio_urls))
          PY
      - name: Commit generated dispatch and MP3 files
        env:
          PUSH_TOKEN: ${{ secrets.GH_PAT }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          git config user.name "agent-anna"
          git config user.email "agent-anna@users.noreply.github.com"
          git add strayd/last-dahl-dispatch.json strayd/audio/*.mp3
          if ! git diff --staged --quiet; then
            git commit -m "feat(dispatch): render MP3 files in selected voice and commit dispatch"
            TOK="${PUSH_TOKEN:-$FALLBACK_TOKEN}"
            git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi