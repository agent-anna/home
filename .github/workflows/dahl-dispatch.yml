name: Agent Anna Dahl Dispatch
on:
  workflow_dispatch:
    inputs:
      song_index:
        description: "0-based track index in strayd/songs-db.json"
        required: false
        default: "0"
      angle:
        description: "Optional hook or story angle"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Dahl MiniMax-M2.7 generator
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_KEY }}
          SONG_INDEX: ${{ github.event.inputs.song_index || '0' }}
          ANGLE: ${{ github.event.inputs.angle || '' }}
        run: |
          python3 - << 'PY'
          import datetime, json, os, pathlib, re, urllib.request

          key = (os.environ.get("DAHL_API_KEY") or "").strip()
          try:
              idx = int((os.environ.get("SONG_INDEX") or "0").strip() or "0")
          except Exception:
              idx = 0
          angle = (os.environ.get("ANGLE") or "").strip()
          today = datetime.date.today().strftime("%B %d, %Y")

          def scrub(s):
              s = str(s or "")
              s = re.sub(r"<think>[\s\S]*?</think>", "", s, flags=re.I).strip()
              s = s.replace("\u2014", ", ").replace("\u2013", "-")
              s = re.sub(r"[:\-=*#~]{4,}", " ", s)
              s = re.sub(r"\s+,", ",", s)
              return re.sub(r"[ \t]{2,}", " ", s).strip()

          ess_path = pathlib.Path("bible/dispatch-essentials.md")
          ess_txt = ess_path.read_text(encoding="utf-8", errors="ignore")[:3500] if ess_path.exists() else ""

          songs_path = pathlib.Path("strayd/songs-db.json")
          songs = []
          if songs_path.exists():
              try:
                  raw = json.loads(songs_path.read_text(encoding="utf-8", errors="ignore"))
                  songs = raw if isinstance(raw, list) else (raw.get("songs") or raw.get("tracks") or [])
              except Exception:
                  songs = []
          track = songs[idx] if songs and 0 <= idx < len(songs) else {"title": "Adhd I Can Do That (Travillen Disorder)", "artist": "Martin Strayd"}
          title = scrub(track.get("title") or track.get("name") or "Adhd I Can Do That (Travillen Disorder)")
          artist = scrub(track.get("artist") or "Martin Strayd")
          topic = scrub(track.get("topic") or track.get("theme") or track.get("mood") or track.get("genre") or angle or "neurodivergent drive and high-speed focus")

          sys_msg = (
              "Return ONLY valid JSON with keys: djIntro, press, x, tiktok, instagram, facebook, ytTitle, ytDesc.\n"
              "Rules:\n"
              "1. NO em-dashes or en-dashes (no — or –), NO repeated symbols like ::::::.\n"
              "2. Keep full single title intact as ONE single song.\n"
              "3. press: Press release for the SINGLE OF THE DAY (single title + Martin Strayd + daily single and licensed original music), list the WORLD RADIO CITIES playing his song from ESSENTIALS, include ABOUT MARTIN STRAYD (Australian lyricist, songwriter, composer; former guitar tech including Steve Jones of the Sex Pistols and Doug Fieger of The Knack), and include MP3/art bundle ownership (share freely with friends for non-commercial play, no resale) plus CTA and links.\n"
              "4. socials (x, tiktok, instagram, facebook, ytTitle, ytDesc): Use the single title, song topic, and artist through the lens of how a real DJ promotes and backs a new song drop (cueing the hook, calling out the theme/topic, building rotation energy, and directing listeners to hear and grab the bundle). Do NOT pitch a 28-day ad campaign.\n"
              "5. Limits: x under 275 chars (max 2 tags), ytTitle under 95 chars (0 tags), tiktok/instagram max 3 tags, facebook max 2 tags, ytDesc max 3 tags.\n"
              "ESSENTIALS:\n" + ess_txt
          )
          usr_msg = f"Date: {today}\nSingle of the Day: {title}\nArtist: {artist}\nTopic/Hook: {topic}"

          raw_txt = ""
          api_status = "fallback_ready"
          if key:
              try:
                  req = urllib.request.Request(
                      "https://inference.dahl.global/v1/chat/completions",
                      data=json.dumps({
                          "model": "MiniMaxAI/MiniMax-M2.7",
                          "max_tokens": 1400,
                          "messages": [{"role": "system", "content": sys_msg}, {"role": "user", "content": usr_msg}]
                      }).encode("utf-8"),
                      headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json", "User-Agent": "Agent-Anna-GH"},
                      method="POST"
                  )
                  with urllib.request.urlopen(req, timeout=35) as resp:
                      body = json.loads(resp.read().decode("utf-8"))
                      choices = body.get("choices") or []
                      if choices:
                          raw_txt = ((choices[0].get("message") or {}).get("content") or "")
                          api_status = f"http_{resp.status}"
              except Exception as e:
                  api_status = f"fast_fallback_{type(e).__name__}"
                  print("Dahl fast fallback:", repr(e))

          no_think = re.sub(r"<think>[\s\S]*?</think>", "", raw_txt, flags=re.I).strip()
          fenced = re.sub(r"^```(?:json)?\s*|\s*```$", "", no_think, flags=re.I).strip()
          parsed = {}
          m = re.search(r"\{[\s\S]*\}", fenced)
          if m:
              try:
                  obj = json.loads(m.group(0), strict=False)
                  if isinstance(obj, dict):
                      parsed = {k: scrub(v) for k, v in obj.items()}
              except Exception:
                  parsed = {}

          cities = "Manila, Melbourne, Ecuador, Atlanta, Santiago, Toronto, Denpasar, Paris, Hat Yai"
          base_press = (
              f"FOR IMMEDIATE RELEASE - {today}\n"
              f"Single of the Day: {title} by {artist}\n\n"
              f"Single and World Radio Play: {artist} releases {title} as today's single and licensed original music drop, with world radio airplay reaching cities including {cities}.\n\n"
              f"About Martin Strayd: Australian lyricist, songwriter, and composer, and former guitar technician for rock acts including Steve Jones of the Sex Pistols and Doug Fieger of The Knack.\n\n"
              f"Ownership and CTA: Listeners who get MP3 and cover art bundles own them directly and can share freely with friends for non-commercial play; commercial resale is prohibited. Listen and get the single at https://strayd.com , https://tinyurl.com/martinstrayd , and Apple Music: https://music.apple.com/us/album/adhd-i-can-do-that-travillen-disorder/1863323315?i=1863323317"
          )

          final_d = {
              "djIntro": scrub(parsed.get("djIntro") or f"Spinning today's single drop from {artist}: {title}, locked in on {topic}."),
              "press": scrub(parsed.get("press") or base_press),
              "x": scrub(parsed.get("x") or f"DJ spin alert: {artist} drops single {title} on {topic}. Hear it now: https://music.apple.com/us/album/adhd-i-can-do-that-travillen-disorder/1863323315?i=1863323317 #martinstrayd")[:275],
              "tiktok": scrub(parsed.get("tiktok") or f"Cueing up {title} by {artist}, built around {topic}. Grab the MP3 and art bundle at https://tinyurl.com/martinstrayd and share with friends for non-commercial play #martinstrayd #newmusic")[:2200],
              "instagram": scrub(parsed.get("instagram") or f"In rotation today: {title} by {artist} ({topic}). Own the MP3 and cover art bundle at https://tinyurl.com/martinstrayd and share freely with friends for non-commercial listening. #martinstrayd #songdrop")[:2200],
              "facebook": scrub(parsed.get("facebook") or f"New single rotation from {artist}: {title}, spotlighting {topic}. Full hub at https://strayd.com and bundle at https://tinyurl.com/martinstrayd #martinstrayd")[:63206],
              "ytTitle": scrub(parsed.get("ytTitle") or f"{title} - {artist} (Single Drop)")[:95],
              "ytDesc": scrub(parsed.get("ytDesc") or f"{title} by {artist} | Topic: {topic}. Stream on Apple Music: https://music.apple.com/us/album/adhd-i-can-do-that-travillen-disorder/1863323315?i=1863323317 | Bundle: https://tinyurl.com/martinstrayd | Hub: https://strayd.com #martinstrayd")[:5000],
          }

          out_path = pathlib.Path("strayd/last-dahl-dispatch.json")
          out_path.parent.mkdir(parents=True, exist_ok=True)
          payload = {"date": today, "track": title, "artist": artist, "topic": topic, "api_status": api_status, "dispatch": final_d, "clean_text": scrub(fenced)}
          out_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")
          print("Wrote", out_path, "status:", api_status)
          PY
      - name: Commit generated dispatch
        env:
          PUSH_TOKEN: ${{ secrets.GH_PAT }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          git config user.name "agent-anna"
          git config user.email "agent-anna@users.noreply.github.com"
          git add strayd/last-dahl-dispatch.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(dispatch): single-of-day press release + DJ promo socials"
            TOK="${PUSH_TOKEN:-$FALLBACK_TOKEN}"
            git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi