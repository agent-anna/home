name: Agent Anna Dahl Dispatch
on:
  workflow_dispatch:
    inputs:
      song_index:
        description: "0-based track index in strayd/songs-db.json"
        required: false
        default: "0"
      angle:
        description: "Optional hook or story angle"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Dahl MiniMax-M2.7 generator
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_KEY }}
          SONG_INDEX: ${{ github.event.inputs.song_index || '0' }}
          ANGLE: ${{ github.event.inputs.angle || '' }}
        run: |
          python3 - << 'PY'
          import datetime, json, os, pathlib, re, urllib.request
          key = os.environ.get("DAHL_API_KEY", "").strip()
          if not key:
              raise SystemExit("DAHL_KEY secret is empty")
          idx = int(os.environ.get("SONG_INDEX", "0") or "0")
          angle = os.environ.get("ANGLE", "").strip()
          today = datetime.date.today().strftime("%B %d, %Y")

          bible_docs = []
          bp = pathlib.Path("bible")
          if bp.exists():
              for f in sorted(bp.rglob("*.md")):
                  if f.is_file() and f.stat().st_size > 5:
                      txt = f.read_text(encoding="utf-8", errors="ignore")
                      priority = 0 if re.search(r"radio|city|cities|28|airplay|station", txt, re.I) else 1
                      bible_docs.append((priority, str(f), txt))
          bible_docs.sort(key=lambda x: (x[0], x[1]))

          ctx = [f"=== {name} ===\n{txt[:2200]}" for _, name, txt in bible_docs]
          for folder in ("character",):
              p = pathlib.Path(folder)
              if p.exists():
                  for f in sorted(p.rglob("*.md")):
                      if f.is_file() and f.stat().st_size > 5:
                          ctx.append(f"=== {f} ===\n" + f.read_text(encoding="utf-8", errors="ignore")[:1200])
          for extra in ("strayd/record-brain.json", "strayd/strayd-artist-live.json"):
              ep = pathlib.Path(extra)
              if ep.exists() and ep.is_file():
                  ctx.append(f"=== {extra} ===\n" + ep.read_text(encoding="utf-8", errors="ignore")[:1800])

          songs_path = pathlib.Path("strayd/songs-db.json")
          songs = []
          if songs_path.exists():
              raw = json.loads(songs_path.read_text(encoding="utf-8", errors="ignore"))
              songs = raw if isinstance(raw, list) else (raw.get("songs") or raw.get("tracks") or [])
          track = songs[idx] if songs and 0 <= idx < len(songs) else {"title": "Adhd I Can Do That (Travillen Disorder)", "artist": "Martin Strayd"}
          title = track.get("title") or track.get("name") or "Single"
          artist = track.get("artist") or "Martin Strayd"
          track_json = json.dumps(track, ensure_ascii=False)[:1800]

          rules = (
              "BIBLE-FIRST GROUNDING & STRICT RULES:\n"
              "1. Pull radio stations, 28-day cities, links, voice/broadcast laws, and artist facts directly from the bible/ files and strayd/ data below. Whenever bible/ files are updated, reflect those updates automatically.\n"
              "2. NEVER invent cities, emails, quotes, genres, or instruments not present in the bible/ files, strayd/ files, or TRACK DATA.\n"
              "3. NEVER output em-dashes or en-dashes (no — or – anywhere). Use commas, periods, or hyphens.\n"
              "4. Keep the full track title (including parentheses) as ONE single song.\n"
              "5. Include djIntro (spoken DJ Anna intro), press (daily single release covering who Martin Strayd is, what today's single is and why it exists, the radio stations/cities from the bible, direct MP3 and cover art ownership with free non-commercial sharing, and verified links), plus social posts: x (under 275 chars, max 2 tags), tiktok (max 3 tags), instagram (max 3 tags), facebook (max 2 tags), ytTitle (under 95 chars, 0 tags), ytDesc (max 3 tags).\n"
              "6. Give every platform a distinct angle and phrasing, with fresh wording across cards and #martinstrayd as the shared artist tag.\n"
          )
          sys_msg = rules + "\n" + "\n\n".join(ctx)[:12000]
          usr_msg = f"Date: {today}\nTrack: {title}\nArtist: {artist}\nAngle: {angle}\nTRACK DATA:\n{track_json}\n\nReturn ONLY valid JSON with keys: djIntro, press, x, tiktok, instagram, facebook, ytTitle, ytDesc."
          req = urllib.request.Request(
              "https://inference.dahl.global/v1/chat/completions",
              data=json.dumps({"model": "MiniMaxAI/MiniMax-M2.7", "messages": [{"role": "system", "content": sys_msg}, {"role": "user", "content": usr_msg}]}).encode("utf-8"),
              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json", "User-Agent": "Agent-Anna-GH"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=55) as resp:
              data = json.loads(resp.read().decode("utf-8"))

          def clean(s):
              s = str(s or "")
              s = re.sub(r"<think>[\s\S]*?</think>", "", s, flags=re.I).strip()
              s = s.replace("\u2014", ", ").replace("\u2013", "-")
              s = re.sub(r"\s+,", ",", s)
              return s.strip()

          raw_txt = data["choices"][0]["message"]["content"] or ""
          cleaned = re.sub(r"^```(?:json)?\s*|\s*```$", "", clean(raw_txt), flags=re.I).strip()
          parsed = {}
          m = re.search(r"\{[\s\S]*\}", cleaned)
          if m:
              try:
                  obj = json.loads(m.group(0))
                  limits = {"x": 275, "tiktok": 2200, "instagram": 2200, "facebook": 63206, "ytTitle": 95, "ytDesc": 5000}
                  parsed = {k: clean(v)[:limits[k]] if k in limits else clean(v) for k, v in obj.items()}
              except Exception:
                  parsed = {}
          out_path = pathlib.Path("strayd/last-dahl-dispatch.json")
          payload = {"date": today, "track": title, "artist": artist, "dispatch": parsed, "clean_text": cleaned}
          out_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")
          print("Wrote", out_path)
          PY
      - name: Commit generated dispatch
        env:
          PUSH_TOKEN: ${{ secrets.GH_PAT }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          git config user.name "agent-anna"
          git config user.email "agent-anna@users.noreply.github.com"
          git add strayd/last-dahl-dispatch.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(dispatch): pull radio stations and cities dynamically from bible/"
            TOK="${PUSH_TOKEN:-$FALLBACK_TOKEN}"
            git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi