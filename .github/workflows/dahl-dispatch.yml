name: Agent Anna Dahl Dispatch
on:
  workflow_dispatch:
    inputs:
      song_index:
        description: "0-based track index in strayd/songs-db.json"
        required: false
        default: "0"
      angle:
        description: "Optional hook or story angle"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Dahl MiniMax-M2.7 generator
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_KEY }}
          SONG_INDEX: ${{ github.event.inputs.song_index || '0' }}
          ANGLE: ${{ github.event.inputs.angle || '' }}
        run: |
          python3 - << 'PY'
          import datetime, json, os, pathlib, re, urllib.request
          key = os.environ.get("DAHL_API_KEY", "").strip()
          if not key:
              raise SystemExit("DAHL_KEY secret is empty")
          idx = int(os.environ.get("SONG_INDEX", "0") or "0")
          angle = os.environ.get("ANGLE", "").strip()
          today = datetime.date.today().strftime("%B %d, %Y")
          priority_files = [
              "bible/01-operational-instructions.md",
              "bible/02-links.md",
              "bible/04-voice-and-broadcast-law.md",
              "bible/05-mission-manifesto.md",
              "bible/06-dj-anna-persona.md",
              "bible/07-platform-cadence-and-hashtags.md",
              "character/anna.md",
              "strayd/record-brain.json"
          ]
          ctx = []
          for rel in priority_files:
              p = pathlib.Path(rel)
              if p.exists() and p.is_file():
                  ctx.append(f"=== {rel} ===\n" + p.read_text(encoding="utf-8", errors="ignore")[:1800])
          songs_path = pathlib.Path("strayd/songs-db.json")
          songs = []
          if songs_path.exists():
              raw = json.loads(songs_path.read_text(encoding="utf-8", errors="ignore"))
              songs = raw if isinstance(raw, list) else (raw.get("songs") or raw.get("tracks") or [])
          track = songs[idx] if songs and 0 <= idx < len(songs) else {"title": "Adhd I Can Do That (Travillen Disorder)", "artist": "Martin Strayd"}
          title = track.get("title") or track.get("name") or "Single"
          artist = track.get("artist") or "Martin Strayd"
          track_json = json.dumps(track, ensure_ascii=False)[:2200]
          rules = (
              "ABSOLUTE ZERO-LIE & SHORT-FORM BROADCAST LAWS:\n"
              "1. NEVER invent a city, dateline, email address, website, quote, genre, or instrument. ONLY use exact facts, links, and contacts explicitly written in REPO CONTEXT or TRACK DATA below. If a location or email is not in the files, DO NOT write one.\n"
              "2. Keep the press release concise and punchy (160-220 words max, short paragraphs, zero bloat).\n"
              "3. Treat the full track title (including parentheses) as ONE single song.\n"
              "4. PRESS RELEASE STRUCTURE: FOR IMMEDIATE RELEASE - [Date] | Headline (song, reason, artist) | Lead (2 sentences + verified URL from bible/02-links.md) | The Song & The Reason (only verified track details + why it exists) | The Artist (Martin Strayd + direct MP3 & art ownership, free non-commercial sharing with friends) | Verified Links from bible/02-links.md.\n"
              "5. SOCIAL POSTS: Short, sharp, psychologically tailored per platform (x, tiktok, instagram, facebook, ytTitle, ytDesc) with zero repeated sentences or duplicate hashtag sets.\n"
          )
          sys_msg = rules + "\n" + "\n\n".join(ctx)[:6800]
          usr_msg = f"Date: {today}\nTrack: {title}\nArtist: {artist}\nAngle: {angle}\nTRACK DATA:\n{track_json}\n\nReturn ONLY valid JSON with keys: press, x, tiktok, instagram, facebook, ytTitle, ytDesc."
          req = urllib.request.Request(
              "https://inference.dahl.global/v1/chat/completions",
              data=json.dumps({"model": "MiniMaxAI/MiniMax-M2.7", "messages": [{"role": "system", "content": sys_msg}, {"role": "user", "content": usr_msg}]}).encode("utf-8"),
              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json", "User-Agent": "Agent-Anna-GH"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=55) as resp:
              data = json.loads(resp.read().decode("utf-8"))
          raw_txt = data["choices"][0]["message"]["content"] or ""
          cleaned = re.sub(r"<think>[\s\S]*?</think>", "", raw_txt, flags=re.I).strip()
          cleaned = re.sub(r"^```(?:json)?\s*|\s*```$", "", cleaned.strip(), flags=re.I).strip()
          parsed = {}
          m = re.search(r"\{[\s\S]*\}", cleaned)
          if m:
              try:
                  parsed = json.loads(m.group(0))
              except Exception:
                  parsed = {}
          out_path = pathlib.Path("strayd/last-dahl-dispatch.json")
          payload = {"date": today, "track": title, "artist": artist, "dispatch": parsed, "clean_text": cleaned}
          out_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding="utf-8")
          print("Wrote", out_path)
          PY
      - name: Commit generated dispatch
        env:
          PUSH_TOKEN: ${{ secrets.GH_PAT }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          git config user.name "agent-anna"
          git config user.email "agent-anna@users.noreply.github.com"
          git add strayd/last-dahl-dispatch.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(dispatch): grounded daily release via Dahl MiniMaxAI/MiniMax-M2.7"
            TOK="${PUSH_TOKEN:-$FALLBACK_TOKEN}"
            git push "https://x-access-token:${TOK}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi